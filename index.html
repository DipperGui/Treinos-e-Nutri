<!doctype html><html lang="pt-BR"><head>
<title>Treino e Cardápio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E6EBF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1017" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap">
<style>
/* Layout: uma coluna de app (até 560px). Faixa da semana no topo; painel do dia com abas Treino, Evolução e Cardápio; cartões com toque largo para uso com uma mão. */
:root{
  --bg:#E6EBF3; --surface:#FFFFFF; --surface2:#DCE3EE; --ink:#101A26; --muted:#52606E; --line:#C2CCDA; --dot:rgba(40,60,110,.13);
  --accent:#0A6C74; --accent-ink:#FFFFFF; --ok:#1F7A4D; --bad:#B3261E;
  --c-forca:#5B4BB5; --c-corrida:#BE3F0C; --c-natacao:#0369A1; --c-bike:#3C7A1E; --c-esporte:#A8239A; --c-descanso:#66727C; --c-corpo:#0A6C74;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50; --dot:rgba(255,255,255,.07);
  --accent:#4FC3CC; --accent-ink:#06262A; --ok:#5CCB8C; --bad:#FF8F86;
  --c-forca:#AC9FF3; --c-corrida:#F6A070; --c-natacao:#5DB9F1; --c-bike:#8DCC64; --c-esporte:#EE92DE; --c-descanso:#8F9BA5; --c-corpo:#4FC3CC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50; --dot:rgba(255,255,255,.07);
  --accent:#4FC3CC; --accent-ink:#06262A; --ok:#5CCB8C; --bad:#FF8F86;
  --c-forca:#AC9FF3; --c-corrida:#F6A070; --c-natacao:#5DB9F1; --c-bike:#8DCC64; --c-esporte:#EE92DE; --c-descanso:#8F9BA5; --c-corpo:#4FC3CC;
  color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{background:transparent;color:var(--ink);font:16px/1.45 var(--f-body);
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font:800 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.nav{display:flex;gap:6px}
.nav button{min-width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:0 12px}
.weekbar{display:flex;flex-direction:column;gap:6px}
.weekbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px;transition:width .25s}

.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);min-width:0}
.pill .sig{font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.pill .d{font:700 24px/1 var(--f-display)}
.pill .dots{display:flex;gap:3px;height:7px}
.pill .dots i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.pill .mini{width:60%;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.pill .mini b{display:block;height:100%;background:var(--accent)}
.pill[aria-pressed="true"]{border-color:var(--ink)}
.pill.today .sig{color:var(--accent)}
.pill.today .d{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}

.panel{display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.phead h2,.dayhead h2{margin:0;font:800 30px/1 var(--f-display);text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.dayhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:auto;gap:2px;padding:3px;border-radius:12px;background:var(--surface2);justify-self:center;min-width:0}
.tabs button{min-height:40px;padding:0 7px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs.sm{justify-self:start}
@media (max-width:470px){.dayhead{grid-template-columns:minmax(0,1fr) auto}.dayhead .tabs{grid-column:1/-1;grid-row:2;justify-self:stretch;grid-auto-columns:minmax(0,1fr)}}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:4px 0 -6px}

.card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wt{font:700 22px/1.1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--tc)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.prchip{align-self:flex-start;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 8px;margin-top:2px}

.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.item.rc{border:0;background:none;padding:4px 0;min-height:48px;border-radius:0}
.item .box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.item .box svg{width:16px;height:16px}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.item[aria-checked="true"] .box{background:var(--tc,var(--ok));border-color:var(--tc,var(--ok));color:#fff}
.item[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

.ex{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sets{display:flex;flex-direction:column;gap:6px}
.sr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sr.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sr .sn{font:700 18px/1 var(--f-display);color:var(--muted);text-align:center}
.sr input,.fld input,.fld textarea,.form input[type=text],.form textarea{font:inherit;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.form input[type=text],.form textarea{background:var(--surface)}
.fld textarea,.form textarea{min-height:72px;resize:vertical}
.fields{display:grid;gap:8px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.prev{font-size:13px;color:var(--muted)}
.calc{font-size:14px;font-weight:600;color:var(--tc);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;flex-wrap:wrap}

.evo .er{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.evo .er.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);border-top:0;padding:0 0 2px}
.evo .en{overflow-wrap:anywhere;font-weight:500}
.good{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.neu{color:var(--muted)}
.esub{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px}

.cb{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.cb .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cb .cn{font-weight:600;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1;fill:none}
.chart .ln{fill:none;stroke:var(--tc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--tc);stroke:var(--surface);stroke-width:2}
.chart .pr{fill:var(--tc);stroke:var(--surface);stroke-width:2}
.chart .hl{fill:var(--surface);stroke:var(--tc);stroke-width:2;visibility:hidden}
.chart .xh{stroke:var(--muted);stroke-width:1;visibility:hidden}
.chart .tx{fill:var(--muted);font:10px var(--f-body);font-variant-numeric:tabular-nums}
.ro{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-height:20px}
details.vals{font-size:13px;color:var(--muted)}
details.vals summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.vals table{border-collapse:collapse;width:100%;margin-top:4px}
.vals th,.vals td{text-align:left;padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.vals th{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.meter .over .fill{background:var(--bad)}
.mgroup{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scale{display:flex;flex-direction:column;gap:6px}
.sq{display:flex;flex-direction:column}
.sqt{font-weight:600}
.sc10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sc10 button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.sc10 button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.note{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface2);font-size:14px}
.note .acts{display:flex;gap:8px;flex-wrap:wrap}

.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.types button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.types button i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.types button[aria-pressed="true"]{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.wedit{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:end;padding:8px;border-radius:10px;background:var(--surface)}
.exrow .nm{grid-column:1/-1}
.exrow .x,.meal .x{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.meal{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;align-items:start;padding:10px;border-radius:12px;background:var(--surface2)}
.meal .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:500!important;color:var(--ink)!important}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.scope{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--surface2)}
.frow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:center}

.me{display:flex;align-items:center;gap:10px;align-self:flex-start;min-height:44px;max-width:100%;padding:4px 14px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none;font-weight:700;font-size:16px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:104px;height:104px;font-size:40px}
.av.big svg{width:44px;height:44px}
.mename{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mename.empty{color:var(--muted);font-weight:500}
.mback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.mback[hidden]{display:none}
@media (min-width:600px){.mback{align-items:center}}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;outline:none}
.mt{margin:0;font:800 26px/1.1 var(--f-display);text-transform:uppercase}
.pcen{display:flex;justify-content:center}
.cg{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.cgi{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.cgi svg{width:30px;height:30px}
.mbox img.big{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface2)}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px;border-radius:12px;background:var(--surface2)}
.pl img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gm{font:700 20px/1 var(--f-display);text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cd{position:relative;aspect-ratio:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;overflow:hidden}
.cd .dn{position:absolute;top:3px;left:5px;font-size:12px;font-weight:700;color:var(--muted)}
.cd.has .dn{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9)}
.cd .ct{position:absolute;right:3px;bottom:3px;font-size:10px;font-weight:700;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;padding:0 5px}
.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
@media (max-width:400px){.tabs button{font-size:12px;padding:0 3px}}

/* ===== Visual: cor por aba, fundo com textura e cartões com mais contraste ===== */
:root{--t-treino:#5B3FD9;--t-treino-ink:#FFFFFF;--t-treino-soft:#ECE8FC;--t-treino-glow:rgba(91,63,217,.20);--t-dia:#BF5A0A;--t-dia-ink:#FFFFFF;--t-dia-soft:#FCEBDC;--t-dia-glow:rgba(217,119,6,.22);--t-evolucao:#0A8760;--t-evolucao-ink:#FFFFFF;--t-evolucao-soft:#DCF3E9;--t-evolucao-glow:rgba(16,160,110,.20);--t-cardapio:#CC2E68;--t-cardapio-ink:#FFFFFF;--t-cardapio-soft:#FBE2EB;--t-cardapio-glow:rgba(209,49,107,.18);--t-galeria:#0A76B6;--t-galeria-ink:#FFFFFF;--t-galeria-soft:#DDEEFA;--t-galeria-glow:rgba(10,120,184,.20);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-treino:#AA9CFF;--t-treino-ink:#1C1352;--t-treino-soft:#272148;--t-treino-glow:rgba(169,155,255,.22);--t-dia:#FFB54F;--t-dia-ink:#3B2100;--t-dia-soft:#3A2B16;--t-dia-glow:rgba(255,181,79,.18);--t-evolucao:#52DBA2;--t-evolucao-ink:#042A1C;--t-evolucao-soft:#15342A;--t-evolucao-glow:rgba(82,219,162,.18);--t-cardapio:#FF8FB7;--t-cardapio-ink:#40081F;--t-cardapio-soft:#3B1B2A;--t-cardapio-glow:rgba(255,143,183,.18);--t-galeria:#6FCDFF;--t-galeria-ink:#052A41;--t-galeria-soft:#13313F;--t-galeria-glow:rgba(111,205,255,.18);}}
:root[data-theme="dark"]{--t-treino:#AA9CFF;--t-treino-ink:#1C1352;--t-treino-soft:#272148;--t-treino-glow:rgba(169,155,255,.22);--t-dia:#FFB54F;--t-dia-ink:#3B2100;--t-dia-soft:#3A2B16;--t-dia-glow:rgba(255,181,79,.18);--t-evolucao:#52DBA2;--t-evolucao-ink:#042A1C;--t-evolucao-soft:#15342A;--t-evolucao-glow:rgba(82,219,162,.18);--t-cardapio:#FF8FB7;--t-cardapio-ink:#40081F;--t-cardapio-soft:#3B1B2A;--t-cardapio-glow:rgba(255,143,183,.18);--t-galeria:#6FCDFF;--t-galeria-ink:#052A41;--t-galeria-soft:#13313F;--t-galeria-glow:rgba(111,205,255,.18);}
body{--accent:var(--t-treino);--accent-ink:var(--t-treino-ink);--accent-soft:var(--t-treino-soft);--glow:var(--t-treino-glow)}
body[data-tab="dia"]{--accent:var(--t-dia);--accent-ink:var(--t-dia-ink);--accent-soft:var(--t-dia-soft);--glow:var(--t-dia-glow)}
body[data-tab="evolucao"]{--accent:var(--t-evolucao);--accent-ink:var(--t-evolucao-ink);--accent-soft:var(--t-evolucao-soft);--glow:var(--t-evolucao-glow)}
body[data-tab="cardapio"]{--accent:var(--t-cardapio);--accent-ink:var(--t-cardapio-ink);--accent-soft:var(--t-cardapio-soft);--glow:var(--t-cardapio-glow)}
body[data-tab="galeria"]{--accent:var(--t-galeria);--accent-ink:var(--t-galeria-ink);--accent-soft:var(--t-galeria-soft);--glow:var(--t-galeria-glow)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(140% 52% at 50% -6%,var(--glow),transparent 64%),radial-gradient(circle at 1px 1px,var(--dot) 1.3px,transparent 1.8px) 0 0/16px 16px}
.card{border-top:3px solid var(--tc,var(--accent));box-shadow:0 10px 22px -16px var(--glow)}

/* ===== v22 (mesclado com a versão 21 publicada): gráficos de barra e coroa, neon, cabeçalho, dias coloridos, tema, perfil ===== */
:root{--mc:#0E9F90;--neon:#0FBF38;--neon-o:#FF6A00;--bar-o:#F97316;--crown:#FFC21A;--pill-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mc:#2DD4BF;--neon:#39FF14;--neon-o:#FF8A1F;--bar-o:#FF9A3C;--pill-ink:#0A1017}}
:root[data-theme="dark"]{--mc:#2DD4BF;--neon:#39FF14;--neon-o:#FF8A1F;--bar-o:#FF9A3C;--pill-ink:#0A1017}
.cb .cn{color:var(--neon);font-weight:800;text-shadow:0 0 .6px rgba(0,70,20,.55)}
:root[data-theme="dark"] .cb .cn{text-shadow:0 0 8px rgba(57,255,20,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cb .cn{text-shadow:0 0 8px rgba(57,255,20,.35)}}
details.vals summary{color:var(--neon);font-weight:800;list-style:none;gap:6px;text-shadow:0 0 .6px rgba(0,70,20,.55)}
details.vals summary::-webkit-details-marker{display:none}
details.vals summary svg{width:16px;height:16px;flex:none;transition:transform .2s}
details.vals[open] summary svg{transform:rotate(180deg)}
.chart .bar-p{fill:var(--bar-o)}
.chart .bar-f{fill:var(--c-forca)}
.chart .bar-b{fill:var(--neon-o);filter:drop-shadow(0 0 3px var(--neon-o))}
.chart .bar-g{fill:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.chart .crown{fill:var(--crown);stroke:#6B4200;stroke-width:.9;stroke-linejoin:round}
.dnav button[data-act="dtoday"]{transition:filter .2s,opacity .2s}
.dnav button[data-act="dtoday"].dim{filter:saturate(0);opacity:.5}
.dnav button[data-act="dtoday"].now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;box-shadow:0 0 0 1px var(--accent),0 0 14px 1px var(--accent),0 0 28px -2px var(--accent)}
header .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mewrap{position:relative;min-width:0}
.tgl{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tgl svg{width:22px;height:22px}
.pmenu{position:absolute;top:calc(100% + 8px);left:0;z-index:40;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pmenu[hidden]{display:none}
.pmenu button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;padding:0 18px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.pmenu button.px{width:44px;align-self:flex-start;font-size:20px;line-height:1;padding:0;color:var(--muted)}
header .top{flex-wrap:nowrap;align-items:flex-end;gap:10px}
header .top>div:first-child{min-width:0;flex:1 1 auto}
header .top .nav{flex:none}
header .nav button{flex:none;white-space:nowrap}
h1.logo{font-size:min(32px,calc((min(100vw,560px) - 236px)/7.6))}
.pill.col{border-color:transparent;color:var(--pill-ink);overflow:hidden}
.pill.col .sig,.pill.col .d{color:var(--pill-ink)}
.pill.col .dots{display:none}
.pill.col .mini{background:color-mix(in srgb,var(--pill-ink) 28%,transparent)}
.pill.col .mini b{background:var(--pill-ink)}
.pill.col[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.pill.col.today .d{text-decoration-color:var(--pill-ink)}
.pill.col.today{box-shadow:0 0 0 2px var(--accent)}
.pill.col.today[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.bodymap .zl.ov{pointer-events:none;stroke:transparent}
.bodymap .zl.ov.on{stroke:var(--accent)}
.stbox{display:grid;grid-template-columns:minmax(0,1fr) 34px 92px;align-items:stretch}
.stcol{display:flex;flex-direction:column;gap:10px}
.stcol .fld{flex:1;justify-content:center}
.stcon{width:34px;height:100%;display:block}
.stcon path{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.stimc{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;border:2px solid var(--accent);background:var(--accent-soft)}
.stimc b{font:800 30px/1 var(--f-display);color:var(--ink)}
.stimc span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.gst{display:inline-flex;align-self:flex-start;margin-top:2px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:1px solid var(--muted);color:var(--muted)}
.gst[hidden]{display:none}
.gst.baixo{color:var(--c-natacao);border-color:var(--c-natacao)}
.gst.normal{color:var(--ok);border-color:var(--ok)}
.gst.acima{color:var(--bad);border-color:var(--bad)}

/* ===== v24: reps com − / +, rótulos neon, timer do treino ===== */
:root{--neon-p:#9A1FFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--neon-p:#C25BFF}}
:root[data-theme="dark"]{--neon-p:#C25BFF}
.sr{grid-template-columns:30px minmax(0,1.4fr) minmax(0,1fr)}
.sr.h span.np{color:var(--neon-p);font-weight:800;font-size:12px;letter-spacing:.08em}
:root[data-theme="dark"] .sr.h span.np{text-shadow:0 0 8px rgba(194,91,255,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sr.h span.np{text-shadow:0 0 8px rgba(194,91,255,.45)}}
.rp{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:5px;align-items:stretch;min-width:0}
.rp button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.rp button:active{background:var(--surface2)}
.rp input{text-align:center;padding-left:4px!important;padding-right:4px!important}
.ex.done{padding-bottom:2px}
.item.rc.rest{cursor:default}
.tmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tmbtn{display:inline-flex;align-items:center;gap:8px;border-color:var(--t-treino)!important;color:var(--t-treino)!important}
.tmbtn svg{width:18px;height:18px;flex:none}
.tmon{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t-treino)}
.tbar{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;width:min(calc(100% - 24px),520px);z-index:19;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:46px;border-radius:999px;background:var(--surface);border:1.5px solid var(--t-treino);box-shadow:0 0 16px -4px var(--t-treino),0 10px 24px -10px rgba(0,0,0,.5);color:var(--t-treino);padding:0 5px}
@supports (backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px)){.tbar{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
.tbar[hidden]{display:none}
.tbar>div{display:flex;align-items:center;gap:6px;padding:0 4px;min-width:0}
.tbar .tr{border-left:1px solid var(--line);justify-content:center}
.tbar .ti{display:grid;place-items:center;flex:none}
.tbar .ti svg{width:19px;height:19px}
.tbar .tv{font:700 17px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--t-treino);margin-right:auto;white-space:nowrap}
.tbar .tr .tv{margin-right:0}
.tbar button{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--t-treino-soft);color:var(--t-treino);border:1px solid var(--t-treino);padding:0}
.tbar button svg{width:16px;height:16px}
body.hastm{padding-bottom:calc(236px + env(safe-area-inset-bottom,0px))}

/* ===== v25: barra do timer compacta, exercício por tempo, notas por exercício ===== */
.tbar{width:max-content;max-width:calc(100% - 24px);height:56px;grid-template-columns:auto auto;padding:0 8px}
.tbar>div{padding:0 8px;gap:7px}
.tbar .tcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.tbar .tcol small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;opacity:.85}
.tbar .tv{margin-right:6px;font-size:18px}
.tbar .tr .tv{margin-right:4px}
.tbar button{width:32px;height:32px}
.tbar .ti svg{width:18px;height:18px}
.ex{position:relative}
.ex .item.rc{padding-right:50px}
.exnote{position:absolute;top:8px;right:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:none}
.exnote svg{width:26px;height:26px}
.exnote.has{color:var(--neon)}
:root[data-theme="dark"] .exnote.has{filter:drop-shadow(0 0 5px rgba(57,255,20,.55))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .exnote.has{filter:drop-shadow(0 0 5px rgba(57,255,20,.55))}}
.sr.tm{grid-template-columns:30px minmax(0,1fr) minmax(0,1.7fr)}
.sr.tm .pv{color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-weight:500;opacity:.8}
.tt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;align-items:stretch;min-width:0}
.tt .play{min-height:44px;border-radius:999px;border:1.5px solid var(--t-treino);color:var(--t-treino);background:var(--t-treino-soft);display:grid;place-items:center;padding:0}
.tt .play svg{width:18px;height:18px}
.tt input{text-align:center;font-weight:700!important}
.tt input.run{border-color:var(--t-treino);box-shadow:0 0 0 2px var(--t-treino-soft)}
.mtog{align-self:flex-start;display:inline-flex;align-items:center;gap:8px}
.mtog svg{width:18px;height:18px}
.mtog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.nbox textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:140px;width:100%;resize:vertical}

/* v28 */
.sr[data-sw]{touch-action:pan-y;position:relative;border-radius:12px;transition:background .2s}
.sr.swing{transition:none;user-select:none;-webkit-user-select:none}
.sr.sdone{background:color-mix(in srgb,var(--neon) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neon) 55%,transparent)}
.sr .sn .bd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;font:800 15px/1 var(--f-display);color:#fff}
.bd.bdA{background:#FF8A00;box-shadow:0 0 10px rgba(255,138,0,.6)}
.bd.bdD{background:#00AEFF;box-shadow:0 0 10px rgba(0,174,255,.6)}
.bd.bdF{background:#FF2B2B;box-shadow:0 0 10px rgba(255,43,43,.6)}
.mback.mc{align-items:center}
.mback.mc .mbox{max-width:300px}
.smn{display:flex;flex-direction:column;gap:8px}
.smn h3{margin:0;font:800 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.smn .opt{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;text-align:left}
.smn .opt[aria-pressed="true"]{border-color:var(--ink)}
.smn .opt .bd{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font:800 16px/1 var(--f-display);color:#fff;flex:none}
.smn hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.exswap{position:absolute;top:8px;right:44px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:none}
.exswap svg{width:26px;height:26px}
.ex .item.rc{padding-right:94px}
.ex.done .item.rc{padding-right:50px}
.xtra{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.xtt{font:800 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn.fin{width:100%;min-height:48px;background:#D92D20;border-color:#D92D20;color:#fff;font-weight:800;letter-spacing:.04em}
.xcr{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.xcr .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbar.solo{grid-template-columns:auto}
.tbar.solo .tr{border-left:0}
.tbar .tr{gap:4px}
.tbar .tr button.rs{width:30px;height:30px;font:800 10px/1 var(--f-body);letter-spacing:0}
.tbar .tr button{width:30px;height:30px}
.tbar .tv.rdone{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;max-width:calc(100% - 40px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:.96}
.bsv{display:flex;gap:6px}
.bsv button{min-height:34px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bsv button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bsv button:disabled{opacity:.4}
.hrs{display:flex;align-items:center;gap:10px}
.hrs button{width:52px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:700 22px/1 var(--f-body);color:var(--ink)}
.hrs .hv{flex:1;text-align:center;font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hrs button:disabled,.sc10 button:disabled{opacity:.45}
header .nav button[data-act="today"]{transition:filter .2s,opacity .2s}
header .nav button[data-act="today"].dim{filter:saturate(0);opacity:.5}
header .nav button[data-act="today"].now{background:#FF7A00;color:#1A0A00;border-color:#FF7A00;font-weight:800;box-shadow:0 0 0 1px #FF7A00,0 0 14px 1px rgba(255,122,0,.7),0 0 28px -2px rgba(255,122,0,.5)}

/* v29 */
.wf{min-width:64px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0 10px}
.wf:disabled{opacity:.45}
.wf.open{height:112px;grid-template-rows:1fr 1.3fr 1fr;border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize}
.wf .wn{font-size:16px;opacity:.35;font-weight:700;align-self:center}
.wf .wc{font-size:30px;align-self:center;color:var(--accent)}
.slp{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 0}
.slp .wl{font:700 15px/1 var(--f-body);color:var(--muted)}
.supcard{border-top:3px solid var(--neon)}
.supcard .wt{color:var(--neon)}
.supgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.supit{position:relative;display:flex;align-items:center;gap:2px;padding:2px 2px 2px 8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0}
.supit .item{flex:1;min-width:0;min-height:48px;padding:4px 0;background:none;border:0}
.supit .item .t{font-size:13px;line-height:1.2;overflow-wrap:break-word;hyphens:manual}
.supit .item .txt{min-width:0}
.supit .item{gap:8px}
.supit .item .box{width:24px;height:24px;flex:none}
.supit .exnote{position:static;width:30px;height:34px;flex:none}
.supit .exnote svg{width:22px;height:22px}
.item.nx .box{background:#E5202E;border-color:#E5202E;color:#fff}
.item.nx .t{color:var(--muted)}
.item.nx[aria-checked="false"] .t{text-decoration:none}
.mrow2[data-msw]{touch-action:pan-y;position:relative}
.mrow2.swing{transition:none;user-select:none;-webkit-user-select:none}
.nph{display:flex;flex-direction:column;gap:8px}
.nphv img{width:100%;max-height:36vh;object-fit:contain;border-radius:12px;background:var(--surface2)}
.hbtns{display:flex;gap:8px;align-items:center}
.gm{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#E5202E;border:1px solid #FF5A64;color:#fff;box-shadow:0 0 0 3px rgba(229,32,46,.2),0 0 14px rgba(255,60,70,.5)}
.gm svg{width:26px;height:26px}
.soon{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:6px 0 2px}
.soon .orb{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#FF6B73,#E5202E 60%,#A00F1B);box-shadow:0 0 0 6px rgba(229,32,46,.18),0 0 34px rgba(255,50,64,.6)}
.soon .orb svg{width:52px;height:52px}
.soon h2{margin:0;font:800 40px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#E5202E}
.soon p{margin:0;font-size:15px;line-height:1.45;color:var(--muted);max-width:30ch}
.soon .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.soon .chips span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}

/* v30 */
.sr{grid-template-columns:30px minmax(0,1fr) minmax(0,1.1fr) 18px}
.sr.tm{grid-template-columns:30px minmax(0,1fr) minmax(0,1.7fr) 18px}
.rp{grid-template-columns:32px minmax(0,1fr) 32px;gap:4px}
.rp button{font-size:20px}
.dg{display:grid;place-items:center;color:var(--muted);opacity:.65;width:18px;height:30px}
.dg svg{width:18px;height:18px}
.ex .exh{display:flex;align-items:center;gap:8px;min-width:0}
.ex .exh .exck{width:44px;min-width:44px;flex:none;min-height:48px;padding:0 0 0 2px;gap:0;justify-content:flex-start}
.ex .exh .exck.item.rc{padding-right:0}
.ex .extog{flex:1 1 0;width:auto;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;min-height:48px;padding:4px 94px 4px 0;border-radius:10px}
.ex.done .extog{padding-right:50px}
.ex .extog .exm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ex .extog .t{font-weight:600;overflow-wrap:anywhere}
.ex.done .extog .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ex.done{opacity:.6}
.ex.done .gtag{filter:grayscale(1)}
.ex .extog .chev{width:18px;height:18px}
.ex .extog[aria-expanded="true"] .chev{transform:rotate(180deg)}
.exs{font:800 13px/1.2 var(--f-body);color:var(--neon);letter-spacing:.01em}
:root[data-theme="dark"] .exs{text-shadow:0 0 8px rgba(57,255,20,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .exs{text-shadow:0 0 8px rgba(57,255,20,.35)}}
.wfoot{display:flex;justify-content:flex-end;padding-top:10px}
.resbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--tc,var(--accent));color:var(--tc,var(--accent))}
.resbtn svg{width:24px;height:24px}
.rswk{font:800 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.rsw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rsd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:64px;color:var(--ink)}
.rsd .rw{font:700 10px/1 var(--f-body);color:var(--muted);letter-spacing:.04em}
.rsd .rn{font:800 18px/1 var(--f-display)}
.rsd .rdots{display:flex;gap:2px;min-height:6px}
.rsd .rdots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.rsd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.rsd.src{border-style:dashed}
.rsd:disabled{opacity:.35}
.rsd.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rsd.on .rw{color:inherit}
.rschips{display:flex;gap:6px;flex-wrap:wrap}
.rssum{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-weight:600}

/* v31 */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
.wwrap{position:relative;padding-bottom:66px}

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dm(t){var d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)}
function dmy(t){var d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function num(s){var x=parseFloat(String(s==null?'':s).replace(',','.'));return isFinite(x)?x:null}
function fmtN(n,dec){var s=n.toFixed(dec);if(s.indexOf('.')>-1)s=s.replace(/\.?0+$/,'');return s.replace('.',',')}
function fmtI(n){return Math.round(n).toLocaleString('pt-BR')}
function parseTime(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  var p=s.split(':').map(function(x){return parseFloat(x.replace(',','.'))});
  for(var i=0;i<p.length;i++)if(!isFinite(p[i])||p[i]<0)return null;
  var t=p.length===1?p[0]*60:p.length===2?p[0]*60+p[1]:p.length===3?p[0]*3600+p[1]*60+p[2]:null;
  return t>0?t:null;
}
function fmtT(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)}

/* Cardio: pace (min/km), velocidade (km/h), ritmo por 100 m. */
function metrics(tipo,lg){
  lg=lg||{};var dist=tipo==='esporte'?null:num(tipo==='natacao'?lg.m:lg.km),t=parseTime(lg.t),pace=null,kmh=null;
  if(dist>0&&t>0){pace=tipo==='natacao'?t/(dist/100):t/dist;if(tipo==='bike')kmh=dist/(t/3600)}
  return {dist:dist,t:t,pace:pace,kmh:kmh};
}
function paceOf(tipo,dist,t){return tipo==='natacao'?t/(dist/100):t/dist}
function calcText(tipo,lg){
  var m=metrics(tipo,lg);
  if(tipo==='esporte'){
    if(m.t==null)return 'Preencha o tempo de atuação.';
    return 'Tempo de atuação: '+fmtT(m.t);
  }
  if(m.pace==null)return tipo==='natacao'?'Preencha metros e tempo para ver o ritmo.':'Preencha distância e tempo para ver o pace.';
  if(tipo==='natacao')return 'Ritmo médio: '+fmtT(m.pace)+' /100 m';
  var s='Pace médio: '+fmtT(m.pace)+' /km';
  if(tipo==='bike')s+=' · '+fmtN(m.kmh,1)+' km/h';
  return s;
}

/* Séries de musculação: cada série tem reps e peso. Registros antigos (uma série única) são convertidos na leitura. */
function plannedN(e){return Math.max(1,Math.min(12,parseInt(e.series,10)||3))}
function getSets(l,e){
  if(l&&l.sets)return l.sets;
  var n=plannedN(e),kg=(l&&l.kg)||'',r=(l&&l.r!==undefined)?l.r:(e.reps||'');
  if(l&&l.s)n=Math.max(1,Math.min(12,parseInt(l.s,10)||n));
  var a=[];for(var j=0;j<n;j++)a.push({r:r,kg:kg});return a;
}
function exMax(l,e){var m=null;getSets(l,e).forEach(function(s){var v=num(s.kg);if(v!=null&&v>0&&(m==null||v>m))m=v});return m}

/* Armazenamento: conta do viewer (db) quando disponível, senão este navegador. */
var store={mode:'local',col:null,
  init:function(){

var state={plan:{versoes:{}},planLoaded:false,weekStart:mondayOf(today),sel:(today.getDay()+6)%7,

var q=Promise.resolve(),lastHist='';
function setStatus(k){
  var el=document.getElementById('status');

}

var timers={};

  try{gamAfter(k)}catch(e){}

}

/* Plano recorrente: cada versão vale da semana indicada em diante, até a próxima versão. */

/* Índice de histórico (doc "hist"): maior peso por exercício e data, sessões de cardio e peso corporal. Refeito a cada semana salva. */
function normHist(){var h=state.hist;h.ex=h.ex||{};h.c=h.c||{};h.bw=h.bw||{};h.w=h.w||{};h.tx=h.tx||{}}
function nthOfType(treinos,w){var n=0;for(var k=0;k<treinos.length;k++){if(treinos[k].tipo===w.tipo){if(treinos[k]===w)return n;n++}}return n}
function reindexWeek(wk){
  normHist();var h=state.hist,ws=parseYmd(wk),dates=[],i;
  for(i=0;i<7;i++)dates.push(ymd(addDays(ws,i)));
  Object.keys(h.ex).forEach(function(nm){dates.forEach(function(d){delete h.ex[nm].p[d];if(h.ex[nm].s)delete h.ex[nm].s[d]});if(!Object.keys(h.ex[nm].p).length)delete h.ex[nm]});
  Object.keys(h.c).forEach(function(tp){Object.keys(h.c[tp]).forEach(function(key){if(dates.indexOf(key.split('#')[0])>-1)delete h.c[tp][key]})});
  delete h.bw[wk];dates.forEach(function(d){delete h.w[d]});
  Object.keys(h.tx).forEach(function(nm){dates.forEach(function(d){delete h.tx[nm][d]});if(!Object.keys(h.tx[nm]).length)delete h.tx[nm]});
  var plan=planFor(wk),lg=logs(wk),doc=state.weeks[wk]||{};
  for(i=0;i<7;i++){
    (function(i){
      var dia=plan.dias[i],date=dates[i];
      dia.treinos.forEach(function(w){
        if(w.tipo==='forca'){
          w.exercicios.forEach(function(e){
            var l=lg[i+':'+e.id];if(!l)return;
            if(e.modo==='tempo'){var tmx=0;getSets(l,e).forEach(function(s0){var q=parseTime(s0.t);if(q&&q>tmx)tmx=q});var tn=norm(e.nome);if(tmx>0&&tn){h.tx[tn]=h.tx[tn]||{};h.tx[tn][date]=tmx}return}
            var mk=exMax(l,e);if(!(mk>0))return;
            var nm=norm(e.nome);if(!nm)return;
            h.ex[nm]=h.ex[nm]||{n:e.nome,p:{}};h.ex[nm].n=e.nome;h.ex[nm].s=h.ex[nm].s||{};
            if(!(h.ex[nm].p[date]>=mk))h.ex[nm].s[date]=getSets(l,e).filter(function(x){return x.kg}).map(function(x){return {r:String(x.r==null?'':x.r),kg:String(x.kg)}});
            h.ex[nm].p[date]=Math.max(h.ex[nm].p[date]||0,mk);
          });
        }else if(w.tipo==='corrida'||w.tipo==='bike'||w.tipo==='natacao'||w.tipo==='esporte'){
          var m=metrics(w.tipo,lg[i+':'+w.id]);
          if((m.dist>0&&m.t>0)||(w.tipo==='esporte'&&m.t>0)){h.c[w.tipo]=h.c[w.tipo]||{};h.c[w.tipo][date+'#'+nthOfType(dia.treinos,w)]={d:m.dist>0?m.dist:0,t:Math.round(m.t)}}
        }
      });
    })(i);
  }
  var b=num(doc.bw);if(b>0)h.bw[wk]=b;
  var wb=doc.b||{};

function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++)d[i]=[i];for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
  return d[m][n];
}
function similarEx(q){
  var nq=norm(q),out=[];if(nq.length<2)return out;
  var qt=nq.split(' ');
  var CAT=catalog();
  Object.keys(CAT).forEach(function(k){
    var it=CAT[k],sc=99;
    if(k===nq)sc=0;
    else if(k.indexOf(nq)>-1||nq.indexOf(k)>-1)sc=1;
    else{
      var kt=k.split(' ');
      qt.forEach(function(a){kt.forEach(function(b){
        if(a.length>=3&&b.length>=3&&(a.indexOf(b)===0||b.indexOf(a)===0))sc=Math.min(sc,2);
        else if(a.length>=4&&b.length>=4&&lev(a,b)<=(a.length>=8?2:1))sc=Math.min(sc,3);
      })});
      if(sc===99&&nq.length>=4&&lev(nq,k)<=2)sc=3;
    }
    if(sc<99)out.push({key:k,nome:it.nome,series:it.series,reps:it.reps,grupo:it.grupo,sc:sc});
  });
  out.sort(function(a,b){return a.sc-b.sc||(a.nome<b.nome?-1:1)});
  return out.slice(0,4);
}

function deltaN(c,p,dec,unit,better){
  if(c==null||p==null)return '<span class="neu">—</span>';
  var d=c-p;if(Math.abs(d)<Math.pow(10,-dec)/2)return '<span class="neu">= igual</span>';
  var cls=better==='up'?(d>0?'good':'bad'):'neu';
  return '<span class="'+cls+'">'+(d>0?'▲ +':'▼ −')+fmtN(Math.abs(d),dec)+(unit?' '+unit:'')+'</span>';
}
function deltaT(c,p,better){
  if(c==null||p==null)return '<span class="neu">—</span>';
  var d=c-p;if(Math.abs(d)<0.5)return '<span class="neu">= igual</span>';
  var cls=better==='down'?(d<0?'good':'bad'):'neu';
  return '<span class="'+cls+'">'+(d>0?'▲ +':'▼ −')+fmtT(Math.abs(d))+'</span>';
}
function erow(label,pv,cv,dh){return '<div class="er"><span class="en">'+esc(label)+'</span><span class="num">'+pv+'</span><span class="num">'+cv+'</span><span class="num">'+dh+'</span></div>'}

/* Gráficos de linha (uma série por gráfico, cor do tipo de treino). Ponto de melhor marca destacado; toque ou passe o cursor para ver valores; tabela de valores abaixo. */
var chartN=0;
var CHEVD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>';
function crownAt(cx,by){return '<path class="crown" transform="translate('+(cx-9).toFixed(1)+' '+(by-13).toFixed(1)+')" d="M1 12L0 3.500 4.800 7.200 9 1l4.200 6.200L18 3.500 17 12z"/>'}
function barPath(x,w,y0,y1){
  var h=y0-y1,r=Math.min(4,w/2,h);
  return 'M'+(x-w/2).toFixed(1)+' '+y0.toFixed(1)+'V'+(y1+r).toFixed(1)+'Q'+(x-w/2).toFixed(1)+' '+y1.toFixed(1)+' '+(x-w/2+r).toFixed(1)+' '+y1.toFixed(1)+'H'+(x+w/2-r).toFixed(1)+'Q'+(x+w/2).toFixed(1)+' '+y1.toFixed(1)+' '+(x+w/2).toFixed(1)+' '+(y1+r).toFixed(1)+'V'+y0.toFixed(1)+'Z';
}
function chart(pts,o){
  if(pts.length<2){
    return '<div class="prev">'+(pts.length?'Só há um registro ('+esc(o.fmt(pts[0].v))+' em '+dm(pts[0].t)+'). Registre outra data para ver a evolução.':'Sem registros neste período.')+'</div>';
  }
  var bar=o.kind==='bar',W=320,H=132,L=44,R=12,T=24,B=24,id='ch'+(++chartN),t0=pts[0].t,t1=pts[pts.length-1].t,vmin=Infinity,vmax=-Infinity,bi=0;
  pts.forEach(function(p,k){if(p.v<vmin)vmin=p.v;if(p.v>vmax)vmax=p.v});
  if(o.best==='last')bi=pts.length-1;
  else pts.forEach(function(p,k){if(o.best==='min'?p.v<=pts[bi].v+1e-9:p.v>=pts[bi].v-1e-9)bi=k});
  var lo=vmin,hi=vmax;if(hi-lo<1e-9){lo-=1;hi+=1}
  var pad=(hi-lo)*0.12,ylo=lo-pad,yhi=hi+pad;
  if(o.ylo!=null){ylo=o.ylo;yhi=o.yhi}
  if(bar){ylo=0;yhi=vmax*1.08}
  var band=(W-L-R)/pts.length,bw=Math.max(2,Math.min(24,band*0.7));
  function X(t,k){return bar?L+band*(k+0.5):L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R)}
  function Y(v){return T+(1-(v-ylo)/(yhi-ylo))*(H-T-B)}
  var ticks=o.ticks||(bar?[0,vmax/2,vmax]:(vmax-vmin<1e-9?[vmin]:[vmin,(vmin+vmax)/2,vmax]));
  var s='<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+': '+esc(o.fmt(pts[0].v))+' em '+dm(t0)+' até '+esc(o.fmt(pts[pts.length-1].v))+' em '+dm(t1)+', '+pts.length+' registros">';
  ticks.forEach(function(v){var y=Y(v).toFixed(1);s+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(L-6)+'" y="'+(+y+3.5).toFixed(1)+'" text-anchor="end">'+esc(o.fmt(v))+'</text>'});
  var crowned=o.best==='max'||o.best==='min';
  if(!bar)s+='<path class="ln" d="'+pts.map(function(p,k){return (k?'L':'M')+X(p.t,k).toFixed(1)+' '+Y(p.v).toFixed(1)}).join('')+'"/>';
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'"/>';
  var data=[],cr='';
  pts.forEach(function(p,k){
    var x=+X(p.t,k).toFixed(1),y=+Y(p.v).toFixed(1),isb=k===bi;
    if(bar){
      var cls=isb&&crowned?(o.bar==='pace'?'bar-g':'bar-b'):(o.bar==='pace'?'bar-p':'bar-f');
      s+='<path class="'+cls+'" d="'+barPath(x,bw,Y(0),Math.min(y,Y(0)-1))+'"/>';
      if(isb&&crowned)cr=crownAt(x,y-2);
    }else if(isb&&crowned){cr=crownAt(x,y+7)}
    else s+='<circle class="'+(isb?'pr':'pt')+'" cx="'+x+'" cy="'+y+'" r="'+(isb?5.5:4)+'"/>';
    data.push({x:x,y:y,l:dmy(p.t),v:o.fmt(p.v)});
  });
  s+=cr;
  s+='<circle class="hl" cx="0" cy="0" r="'+(bar?4:7)+'"/>';
  s+='<text class="tx" x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+dm(t0)+'</text><text class="tx" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dm(t1)+'</text></svg>';
  s=s.replace('<svg class="chart"','<svg class="chart" data-pts="'+esc(JSON.stringify(data))+'"');
  var last=pts[pts.length-1],bp=pts[bi];
  var def='Último: '+o.fmt(last.v)+' em '+dm(last.t)+(o.best==='last'?'':' · Melhor: '+o.fmt(bp.v)+' em '+dm(bp.t));
  var rows=pts.slice(-30).reverse().map(function(p){return '<tr><td>'+dmy(p.t)+'</td><td>'+esc(o.fmt(p.v))+'</td></tr>'}).join('');
  return s+'<div class="ro" id="ro-'+id+'" data-def="'+esc(def)+'">'+esc(def)+'</div>'
    +'<details class="vals"><summary>Ver valores'+CHEVD+'</summary><table><thead><tr><th>Data</th><th>'+esc(o.col||'Valor')+'</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}
function onChartPointer(e){
  var svg=e.target&&e.target.closest&&e.target.closest('svg.chart');if(!svg)return;
  var pts;try{pts=JSON.parse(svg.getAttribute('data-pts'))}catch(x){return}
  var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;if(!r.width)return;
  var x=(e.clientX-r.left)/r.width*vb.width,bi=0,bd=1e9;
  pts.forEach(function(p,k){var d=Math.abs(p.x-x);if(d<bd){bd=d;bi=k}});
  var p=pts[bi],xh=svg.querySelector('.xh'),hl=svg.querySelector('.hl');
  xh.setAttribute('x1',p.x);xh.setAttribute('x2',p.x);xh.style.visibility='visible';

function csvEsc(v){v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildRows(weeks){
  var R=[['Data','Dia','Tipo','Treino','Item','Série','Reps','Peso (kg)','Distância','Unidade','Tempo','Pace / ritmo','Kcal','Proteína (g)','Feito','Observação']];
  function c(v){return v==null?'':String(v).replace('.',',')}
  Object.keys(weeks).sort().forEach(function(wk){
    var wd=weeks[wk],f=wd.f||{},d=wd.d||{},n=wd.n||{},plan=planFor(wk),ws=parseYmd(wk);
    for(var i=0;i<7;i++){
      (function(i){
        var date=ymd(addDays(ws,i)),dia=plan.dias[i],dn=DIAS[i];
        dia.treinos.forEach(function(w){
          var tt=TIPOS[w.tipo],tl=w.titulo||tt;
          if(w.tipo==='forca'&&w.exercicios.length){
            w.exercicios.forEach(function(e){
              var k=i+':'+e.id,l=d[k],done=f[k]?'Sim':'Não',any=false;
              if(l)getSets(l,e).forEach(function(s,j){if(s.kg){any=true;R.push([date,dn,tt,tl,e.nome,j+1,c(s.r),c(s.kg),'','','','','','',done,''])}});
              if(!any&&f[k])R.push([date,dn,tt,tl,e.nome,'','','','','','','','','',done,'']);
            });
          }else{
            var k2=i+':'+w.id,l2=d[k2],isC=w.tipo==='corrida'||w.tipo==='bike'||w.tipo==='natacao'||w.tipo==='esporte';
            if(!l2&&!f[k2])return;
            var m=isC?metrics(w.tipo,l2):{},pace=m.pace!=null?fmtT(m.pace)+(w.tipo==='natacao'?' /100 m':' /km'):'';
            R.push([date,dn,tt,tl,tl,'','','',isC&&m.dist!=null?c(m.dist):'',isC&&w.tipo!=='esporte'?(w.tipo==='natacao'?'m':'km'):'',l2&&l2.t?l2.t:'',pace,'','',f[k2]?'Sim':'Não','']);
          }
        });
        dia.refeicoes.forEach(function(m0){var m=mealEffFrom(wd,i,m0),k=i+':'+m.id;if(f[k])R.push([date,dn,'Refeição','',m.nome,'','','','','','','',c(m.kcal),c(m.prot),'Sim','']) });
        if(n[i])R.push([date,dn,'Observação','','','','','','','','','','','','',n[i]]);
        var wb=(wd.b||{})[i];
        if(wb)BEM.forEach(function(q){if(wb[q[0]]!=null){var r=[date,dn,'Bem-estar','',q[1]];while(r.length<16)r.push('');r.push(wb[q[0]]);R.push(r)}});
      })(i);
    }
    if(num(wd.bw)>0)R.push([wk,'','Peso corporal','','Peso da semana','','',c(wd.bw),'','','','','','','','']);
  });
  R[0].push('Nota (1 a 10)');
  for(var z=1;z<R.length;z++)while(R[z].length<17)R[z].push('');
  return R;
}
function exportCSV(){

}

function loadImg(blob){return new Promise(function(res,rej){
  var u=URL.createObjectURL(blob),im=new Image();
  im.onload=function(){URL.revokeObjectURL(u);res(im)};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('imagem'))};
  im.src=u;
})}
function drawJpeg(im,max,q,square){
  var w=im.naturalWidth,h=im.naturalHeight,sx=0,sy=0,sw=w,sh=h,cw,ch;
  if(square){var m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;cw=ch=max}
  else{var k=Math.min(1,max/Math.max(w,h));cw=Math.max(1,Math.round(w*k));ch=Math.max(1,Math.round(h*k))}
  var c=document.createElement('canvas');c.width=cw;c.height=ch;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
  return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)});
}
function processImage(file){
  return loadImg(file).then(function(im){
    return drawJpeg(im,1080,0.78).then(function(full){
      return drawJpeg(im,240,0.7).then(function(th){return {full:full,thumb:th}});
    });
  });
}

var CRC=null;

  c.setUint32(16,crc,true);c.setUint32(20,u8.length,true);c.setUint32(24,u8.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,this.off,true);

function backupFotos(){
  photos.allMeta().then(function(metas){
    if(!metas.length){setStatus('fotoempty');return}
    metas.sort(function(a,b){return a.key<b.key?-1:1});
    var z=new ZipW(),idx=[],used={},i=0;
    return metas.reduce(function(p,m){
      return p.then(function(){
        return photos.getFull(m.key).then(function(r){
          if(!r)return;
          return r.blob.arrayBuffer().then(function(ab){
            var base=m.date+'_'+slugify(m.label||m.wid),nm=base+'.jpg',c=1;
            while(used[nm]){c++;nm=base+'-'+c+'.jpg'}
            used[nm]=1;
            z.add(nm,new Uint8Array(ab),m.ts);
            idx.push({file:nm,key:m.key,date:m.date,wid:m.wid,label:m.label,ts:m.ts});
            i++;state.msg='Preparando backup… '+i+'/'+metas.length;setStatus('msg');
          });
        });
      });
    },Promise.resolve()).then(function(){
      z.add('fotos.json',new TextEncoder().encode(JSON.stringify({app:'treino-e-cardapio-fotos',v:1,fotos:idx})),Date.now());
      return saveFile('backup-fotos-'+ymd(new Date())+'.zip',z.blob(),'application/zip');
    }).then(function(){state.msg='Backup das fotos pronto. Guarde o arquivo.';setStatus('msg')});
  }).catch(function(e){
    if(e&&e.name==='AbortError')return;
    state.msg='Não foi possível fazer o backup das fotos.';setStatus('msg');
  });
}
function restoreFotos(file){
  if(!file)return;
  state.msg='Lendo arquivo…';setStatus('msg');
  file.arrayBuffer().then(function(buf){
    var ents=zipRead(buf),by={};
    ents.forEach(function(e){by[e.name]=e});
    var idxP=by['fotos.json']?zipData(buf,by['fotos.json']).then(function(u){try{return JSON.parse(new TextDecoder().decode(u))}catch(x){return null}}):Promise.resolve(null);
    return idxP.then(function(ix){
      var map={};if(ix&&ix.fotos)ix.fotos.forEach(function(m){map[m.file]=m});
      var imgs=ents.filter(function(e){return /\.(jpe?g|png|webp)$/i.test(e.name)});
      if(!imgs.length)throw new Error('sem fotos');
      if(!confirm('Restaurar '+imgs.length+' foto(s)? As que já existem no mesmo dia e treino são mantidas.')){setStatus('ok');return}
      var done=0,added=0,skipped=0;
      return imgs.reduce(function(p,e){
        return p.then(function(){
          var base=e.name.split('/').pop(),m=map[e.name]||map[base]||null,dm2=/^(\d{4}-\d{2}-\d{2})/.exec(base);
          var date=m?m.date:(dm2?dm2[1]:null);
          done++;state.msg='Restaurando fotos… '+done+'/'+imgs.length;setStatus('msg');
          if(!date){skipped++;return}
          var plain=base.replace(/\.[^.]+$/,''),wid=m?m.wid:'x-'+slugify(plain),key=m?m.key:pkey2(date,wid);
          if(state.pk[key]){skipped++;return}
          return zipData(buf,e).then(function(u){
            var blob=new Blob([u],{type:'image/jpeg'});
            return loadImg(blob).then(function(im){
              var fullP=m?Promise.resolve(blob):drawJpeg(im,1080,0.78);
              return fullP.then(function(full){
                return drawJpeg(im,240,0.7).then(function(th){
                  return photos.put({key:key,date:date,wid:wid,label:m?m.label:plain,ts:m?m.ts:Date.now(),thumb:th},full);
                });
              });
            });
          }).then(function(){state.pk[key]=true;added++},function(){skipped++});
        });
      },Promise.resolve()).then(function(){
        state.msg='Fotos restauradas: '+added+(skipped?' · '+skipped+' ignorada(s) ou já existentes':'')+'.';
        setStatus('msg');render();
      });
    });
  }).catch(function(){state.msg='Arquivo de fotos inválido.';setStatus('msg')});
}

function saveFile(name,text,type){
  if(state.dl)return state.dl.save({filename:name,data:text});
  var blob=(text instanceof Blob)?text:new Blob([text],{type:type});
  try{var f=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]}).catch(function(e){if(e&&e.name==='AbortError')return;throw e})}catch(e){}
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);return Promise.resolve()}
function backup(){
  store.all().then(function(d){
    if(!Object.keys(d).length){setStatus('bkerr');return}
    var txt=JSON.stringify({app:'treino-e-cardapio',v:1,data:d});
    return saveFile('backup-treino-'+ymd(new Date())+'.json',txt,'application/json').then(function(){setStatus('bk')});
  }).catch(function(e){if(e&&(e.code==='declined'))return;setStatus('bkerr')});
}
function restoreFile(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result)}catch(e){}
    if(!j||j.app!=='treino-e-cardapio'||!j.data){setStatus('rsterr');return}
    var names=Object.keys(j.data);
    if(!confirm('Restaurar '+names.length+' registros? Isso substitui os dados atuais com os mesmos nomes.'))return;
    var p=Promise.resolve();
    names.forEach(function(n){p=p.then(function(){return store.set(n,j.data[n])})});
    p.then(function(){location.reload()},function(){setStatus('rsterr')});
  };
  rd.readAsText(file);
}

function thLum(h){var n=parseInt(h.slice(1),16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}
function thInk(h){return thLum(h)>0.6?'#0A1017':'#FFFFFF'}
function thVars(p,dark){
  var o='color-scheme:'+(dark?'dark':'light')+';--bg:'+p.bg+';--surface:'+p.s1+';--surface2:'+p.s2+';--ink:'+p.ink+';--muted:'+p.mu+';--line:'+p.ln+';--dot:'+(dark?'rgba(255,255,255,.07)':'rgba(40,30,20,.10)')+';--ok:'+p.a3+';--bad:'+(dark?'#FF8F86':'#B3261E')+';--neon:'+p.ne+';--neon-ink:'+thInk(p.ne)+';--neon-o:'+p.a2+';--bar-o:'+p.a2+';--pill-ink:'+thInk(p.a1)+';';
  [['treino','a1'],['dia','a2'],['evolucao','a3'],['cardapio','a4'],['galeria','a5']].forEach(function(t){
    var c=p[t[1]];o+='--t-'+t[0]+':'+c+';--t-'+t[0]+'-ink:'+thInk(c)+';--t-'+t[0]+'-soft:color-mix(in srgb,'+c+' 22%,'+p.s1+');--t-'+t[0]+'-glow:color-mix(in srgb,'+c+' 28%,transparent);';
  });
  return o+'--c-forca:'+p.a1+';--c-corrida:'+p.a2+';--c-natacao:'+p.a5+';--c-bike:'+p.a3+';--c-esporte:'+p.a4+';--c-descanso:'+p.mu+';--c-corpo:'+p.a3+';';
}
function thCss(it){
  var sel=':root:root:root[data-skin]:not([data-mode="edit"])',c='';
  if(it.dk&&it.lt){c=sel+'{'+thVars(it.lt,false)+'}@media (prefers-color-scheme:dark){'+sel+':not([data-theme="light"]){'+thVars(it.dk,true)+'}}'+sel+'[data-theme="dark"]{'+thVars(it.dk,true)+'}'}
  else c=sel+'{'+thVars(it.dk||it.lt,!!it.dk)+'}';
  return c;
}
function thApply(css,id,bgs){
  var st=document.getElementById('gth'),r=document.documentElement;
  if(!css){if(st&&st.parentNode)st.parentNode.removeChild(st);r.removeAttribute('data-skin');window.__skbg=null}
  else{if(!st){st=document.createElement('style');st.id='gth';document.head.appendChild(st)}st.textContent=css;r.setAttribute('data-skin',id);window.__skbg=bgs}
  try{var ms=document.querySelectorAll('meta[name="theme-color"]'),dk=isDark();for(var i=0;i<ms.length;i++){ms[i].removeAttribute('media');ms[i].setAttribute('content',bgs?(dk&&bgs.d||bgs.l||bgs.d):(dk?'#0A1017':'#E6EBF3'))}}catch(e){}
}

/* ---- dados do dia ---- */
function gamDayStat(date){
  var dd=parseYmd(date),wk=ymd(mondayOf(dd)),g=gam.gp[wk],i=(dd.getDay()+6)%7;
  if(g&&g.dy&&g.dy[i])return g.dy[i];
  var dia=planFor(wk).dias[i],n=0,fp=0;
  dia.treinos.forEach(function(w){if(w.tipo==='descanso')return;n++;if(w.tipo==='forca'&&w.exercicios.length)fp++});
  return {d:date,mf:0,mc:0,pl:n,fp:fp,dn:0,st:0,mn:0,rc:0,ml:0,mt:dia.refeicoes.length,ko:0,sp:0,ns:suplList().length,sl:0,fo:0,sh:0,km:0,kb:0,mx:0,mk:0};
}
/* sequência + pontos extras (bônus de sequência e missões resgatadas). Tudo derivado dos registros. */
function gamExtra(){
  if(gam.xc&&gam.xc.v===gam.ver)return gam.xc;
  var items=[],today=ymd(new Date()),first=null,wkNow=ymd(mondayOf(new Date()));
  Object.keys(gam.gp).forEach(function(wk){(gam.gp[wk].dy||[]).forEach(function(D){if(D.dn>0&&(first==null||D.d<first))first=D.d})});
  var cur=0,best=0,fzw={},purch=gam.doc.fzb||0,used=0,frozen=[];
  if(first){
    var d=parseYmd(first),end=parseYmd(today);
    while(d<=end){
      var ds=ymd(d),st=gamDayStat(ds);
      if(st.dn>0){
        cur++;if(cur>best)best=cur;
        var b=cur>=30?20:cur>=14?15:cur>=7?10:cur>=3?5:0;
        if(b)items.push({d:ds,t:'Bônus de sequência ('+cur+' dias)',p:b,c:'sq',r:''});
      }else if(ds!==today&&st.pl>0){
        var wk=ymd(mondayOf(d));
        if(!fzw[wk]){fzw[wk]=1;frozen.push(ds)}
        else if(purch-used>0){used++;frozen.push(ds)}
        else cur=0;
      }
      d=addDays(d,1);
    }
  }
  var cl=gam.doc.cl||{};
  Object.keys(cl).forEach(function(id){var c=cl[id];if(c&&c.x>0)items.push({d:c.d,t:'Missão: '+c.t,p:c.x,c:'mi',r:''})});
  var T=gamDayStat(today),stock=Math.max(0,purch-used);
  gam.xc={v:gam.ver,items:items,cur:cur,best:best,stock:stock,free:(fzw[wkNow]?0:1)+stock,risk:T.pl>0&&T.dn===0,frozen:frozen};
  return gam.xc;
}

function hsh(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function gamPick(list,seed,n){return list.slice().sort(function(a,b){return hsh(seed+a.id)-hsh(seed+b.id)}).slice(0,n)}
function gamAgg(wk){
  var A={dn:0,pl:0,fp:0,mn:0,st:0,rc:0,md:0,sd:0,mt:0,bw:!!(gam.gp[wk]&&gam.gp[wk].bw),pt:gam.gp[wk]?gam.gp[wk].p:0},ws=parseYmd(wk);
  for(var i=0;i<7;i++){
    var D=gamDayStat(ymd(addDays(ws,i)));
    A.dn+=D.dn;A.pl+=D.pl;A.fp+=D.fp;A.mn+=D.mn;A.st+=D.st;A.rc+=D.rc;A.mt+=D.mt;
    if(D.mt>0&&D.ml>=Math.ceil(D.mt*0.8))A.md++;
    if(D.sl)A.sd++;
  }
  return A;
}

function gamMissions(){
  var today=ymd(new Date()),wk=ymd(mondayOf(new Date())),D=gamDayStat(today),A=gamAgg(wk),cl=gam.doc.cl||{};
  function mk(kind,key,T,arg){
    var id=kind+':'+key+':'+T.id,pr=T.pr(arg),mx=pr[1],cu=Math.min(pr[0],mx);
    return {id:id,t:T.t(arg),x:T.x,c:T.c,cur:cu,max:mx,done:mx>0&&cu>=mx,claimed:!!cl[id]};
  }
  return {
    day:gamPick(MD.filter(function(T){return T.el(D)}),today,3).map(function(T){return mk('d',today,T,D)}),
    week:gamPick(MW.filter(function(T){return T.el(A)}),wk,3).map(function(T){return mk('w',wk,T,A)}),
    bonus:MB.filter(function(T){return T.el(A)}).map(function(T){return mk('b',wk,T,A)})
  };
}
function gamClaimable(M){var n=0;M.day.concat(M.week,M.bonus).forEach(function(m){if(m.done&&!m.claimed)n++});return n}

function gamClaim(id){
  var M=gamMissions(),m=null;
  M.day.concat(M.week,M.bonus).forEach(function(x){if(x.id===id)m=x});
  if(!m||!m.done||m.claimed)return;
  gam.doc.cl=gam.doc.cl||{};
  gam.doc.cl[id]={x:m.x,c:m.c,d:ymd(new Date()),t:m.t};
  gam.doc.coins=(gam.doc.coins||0)+m.c;
  gam.ver++;
  gamSaveDoc();popSound();
  toast('+'+m.x+' pts · +'+m.c+' moedas');
  gamLevelCheck();gamAchCheck(false);gamRefreshAll();gamUpCheck(6);
}

function gamStats(){
  var S={wk:0,st:0,mn:0,rc:0,km:0,kb:0,mf:0,kc:0,sd:0,sl:0,fo:0,sh:0,bw:0,pf:0,mx:0,mk:0,fd:0,mi:0,pw:0,sq:0,r:0,ts:0};
  Object.keys(gam.gp).forEach(function(wk){
    var g=gam.gp[wk],pl=0,dn=0;
    (g.dy||[]).forEach(function(D){
      S.wk+=D.dn;S.st+=D.st;S.mn+=D.mn;S.rc+=D.rc;S.km+=D.km;S.kb+=D.kb;S.fo+=D.fo;S.sh+=D.sh;
      if(D.mt>0&&D.ml>=D.mt)S.mf++;
      if(D.ko)S.kc++;
      if(D.ns>0&&D.sp>=D.ns)S.sd++;
      if(D.sl)S.sl++;
      if(D.mx>S.mx)S.mx=D.mx;if(D.mk>S.mk)S.mk=D.mk;
      if(D.dn>0&&D.mt>0&&D.ml>=D.mt&&(D.ns===0||D.sp>=D.ns)&&D.sl)S.fd++;
      pl+=D.pl;dn+=D.dn;
    });
    if(g.bw)S.bw++;
    if(pl>0&&dn>=pl)S.pf++;
    if(g.p>S.pw)S.pw=g.p;
  });
  var ssx=gamSeasonXP();Object.keys(ssx).forEach(function(m){var t=gamTier(ssx[m])+1;if(t>S.ts)S.ts=t});
  S.sq=gamExtra().best;S.r=gamRank(gamTotals().xp).r;S.mi=Object.keys(gam.doc.cl||{}).length;
  return S;
}
