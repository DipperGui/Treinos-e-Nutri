<!doctype html>
<html lang="pt-BR">
<head>
<title>Treino e Cardápio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E6EBF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1017" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna de app (até 560px). Faixa da semana no topo; painel do dia com abas Treino, Evolução e Cardápio; cartões com toque largo para uso com uma mão. */
:root{
  --bg:#E6EBF3; --surface:#FFFFFF; --surface2:#DCE3EE; --ink:#101A26; --muted:#52606E; --line:#C2CCDA; --dot:rgba(40,60,110,.13);
  --accent:#0A6C74; --accent-ink:#FFFFFF; --ok:#1F7A4D; --bad:#B3261E;
  --c-forca:#5B4BB5; --c-corrida:#BE3F0C; --c-natacao:#0369A1; --c-bike:#3C7A1E; --c-esporte:#A8239A; --c-descanso:#66727C; --c-corpo:#0A6C74;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50; --dot:rgba(255,255,255,.07);
  --accent:#4FC3CC; --accent-ink:#06262A; --ok:#5CCB8C; --bad:#FF8F86;
  --c-forca:#AC9FF3; --c-corrida:#F6A070; --c-natacao:#5DB9F1; --c-bike:#8DCC64; --c-esporte:#EE92DE; --c-descanso:#8F9BA5; --c-corpo:#4FC3CC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50; --dot:rgba(255,255,255,.07);
  --accent:#4FC3CC; --accent-ink:#06262A; --ok:#5CCB8C; --bad:#FF8F86;
  --c-forca:#AC9FF3; --c-corrida:#F6A070; --c-natacao:#5DB9F1; --c-bike:#8DCC64; --c-esporte:#EE92DE; --c-descanso:#8F9BA5; --c-corpo:#4FC3CC;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font:800 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.nav{display:flex;gap:6px}
.nav button{min-width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:0 12px}
.weekbar{display:flex;flex-direction:column;gap:6px}
.weekbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px;transition:width .25s}

.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);min-width:0}
.pill .sig{font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.pill .d{font:700 24px/1 var(--f-display)}
.pill .dots{display:flex;gap:3px;height:7px}
.pill .dots i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.pill .mini{width:60%;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.pill .mini b{display:block;height:100%;background:var(--accent)}
.pill[aria-pressed="true"]{border-color:var(--ink)}
.pill.today .sig{color:var(--accent)}
.pill.today .d{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}

.panel{display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.phead h2,.dayhead h2{margin:0;font:800 30px/1 var(--f-display);text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.dayhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:auto;gap:2px;padding:3px;border-radius:12px;background:var(--surface2);justify-self:center;min-width:0}
.tabs button{min-height:40px;padding:0 7px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs.sm{justify-self:start}
@media (max-width:470px){.dayhead{grid-template-columns:minmax(0,1fr) auto}.dayhead .tabs{grid-column:1/-1;grid-row:2;justify-self:stretch;grid-auto-columns:minmax(0,1fr)}}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:4px 0 -6px}

.card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wt{font:700 22px/1.1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--tc)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.prchip{align-self:flex-start;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 8px;margin-top:2px}

.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.item.rc{border:0;background:none;padding:4px 0;min-height:48px;border-radius:0}
.item .box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.item .box svg{width:16px;height:16px}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.item[aria-checked="true"] .box{background:var(--tc,var(--ok));border-color:var(--tc,var(--ok));color:#fff}
.item[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

.ex{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sets{display:flex;flex-direction:column;gap:6px}
.sr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sr.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sr .sn{font:700 18px/1 var(--f-display);color:var(--muted);text-align:center}
.sr input,.fld input,.fld textarea,.form input[type=text],.form textarea{font:inherit;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.form input[type=text],.form textarea{background:var(--surface)}
.fld textarea,.form textarea{min-height:72px;resize:vertical}
.fields{display:grid;gap:8px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.prev{font-size:13px;color:var(--muted)}
.calc{font-size:14px;font-weight:600;color:var(--tc);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;flex-wrap:wrap}

.evo .er{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.evo .er.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);border-top:0;padding:0 0 2px}
.evo .en{overflow-wrap:anywhere;font-weight:500}
.good{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.neu{color:var(--muted)}
.esub{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px}

.cb{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.cb .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cb .cn{font-weight:600;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1;fill:none}
.chart .ln{fill:none;stroke:var(--tc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--tc);stroke:var(--surface);stroke-width:2}
.chart .pr{fill:var(--tc);stroke:var(--surface);stroke-width:2}
.chart .hl{fill:var(--surface);stroke:var(--tc);stroke-width:2;visibility:hidden}
.chart .xh{stroke:var(--muted);stroke-width:1;visibility:hidden}
.chart .tx{fill:var(--muted);font:10px var(--f-body);font-variant-numeric:tabular-nums}
.ro{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-height:20px}
details.vals{font-size:13px;color:var(--muted)}
details.vals summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.vals table{border-collapse:collapse;width:100%;margin-top:4px}
.vals th,.vals td{text-align:left;padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.vals th{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.meter .over .fill{background:var(--bad)}
.mgroup{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scale{display:flex;flex-direction:column;gap:6px}
.sq{display:flex;flex-direction:column}
.sqt{font-weight:600}
.sc10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sc10 button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.sc10 button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.note{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface2);font-size:14px}
.note .acts{display:flex;gap:8px;flex-wrap:wrap}

.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.types button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.types button i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.types button[aria-pressed="true"]{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.wedit{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:end;padding:8px;border-radius:10px;background:var(--surface)}
.exrow .nm{grid-column:1/-1}
.exrow .x,.meal .x{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.meal{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;align-items:start;padding:10px;border-radius:12px;background:var(--surface2)}
.meal .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:500!important;color:var(--ink)!important}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.scope{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--surface2)}
.frow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:center}

.me{display:flex;align-items:center;gap:10px;align-self:flex-start;min-height:44px;max-width:100%;padding:4px 14px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none;font-weight:700;font-size:16px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:104px;height:104px;font-size:40px}
.av.big svg{width:44px;height:44px}
.mename{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mename.empty{color:var(--muted);font-weight:500}
.mback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.mback[hidden]{display:none}
@media (min-width:600px){.mback{align-items:center}}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;outline:none}
.mt{margin:0;font:800 26px/1.1 var(--f-display);text-transform:uppercase}
.pcen{display:flex;justify-content:center}
.cg{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.cgi{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.cgi svg{width:30px;height:30px}
.mbox img.big{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface2)}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px;border-radius:12px;background:var(--surface2)}
.pl img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gm{font:700 20px/1 var(--f-display);text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cd{position:relative;aspect-ratio:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;overflow:hidden}
.cd .dn{position:absolute;top:3px;left:5px;font-size:12px;font-weight:700;color:var(--muted)}
.cd.has .dn{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9)}
.cd .ct{position:absolute;right:3px;bottom:3px;font-size:10px;font-weight:700;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;padding:0 5px}
.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
@media (max-width:400px){.tabs button{font-size:12px;padding:0 3px}}

/* ===== Visual: cor por aba, fundo com textura e cartões com mais contraste ===== */
:root{--t-treino:#5B3FD9;--t-treino-ink:#FFFFFF;--t-treino-soft:#ECE8FC;--t-treino-glow:rgba(91,63,217,.20);--t-dia:#BF5A0A;--t-dia-ink:#FFFFFF;--t-dia-soft:#FCEBDC;--t-dia-glow:rgba(217,119,6,.22);--t-evolucao:#0A8760;--t-evolucao-ink:#FFFFFF;--t-evolucao-soft:#DCF3E9;--t-evolucao-glow:rgba(16,160,110,.20);--t-cardapio:#CC2E68;--t-cardapio-ink:#FFFFFF;--t-cardapio-soft:#FBE2EB;--t-cardapio-glow:rgba(209,49,107,.18);--t-galeria:#0A76B6;--t-galeria-ink:#FFFFFF;--t-galeria-soft:#DDEEFA;--t-galeria-glow:rgba(10,120,184,.20);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-treino:#AA9CFF;--t-treino-ink:#1C1352;--t-treino-soft:#272148;--t-treino-glow:rgba(169,155,255,.22);--t-dia:#FFB54F;--t-dia-ink:#3B2100;--t-dia-soft:#3A2B16;--t-dia-glow:rgba(255,181,79,.18);--t-evolucao:#52DBA2;--t-evolucao-ink:#042A1C;--t-evolucao-soft:#15342A;--t-evolucao-glow:rgba(82,219,162,.18);--t-cardapio:#FF8FB7;--t-cardapio-ink:#40081F;--t-cardapio-soft:#3B1B2A;--t-cardapio-glow:rgba(255,143,183,.18);--t-galeria:#6FCDFF;--t-galeria-ink:#052A41;--t-galeria-soft:#13313F;--t-galeria-glow:rgba(111,205,255,.18);}}
:root[data-theme="dark"]{--t-treino:#AA9CFF;--t-treino-ink:#1C1352;--t-treino-soft:#272148;--t-treino-glow:rgba(169,155,255,.22);--t-dia:#FFB54F;--t-dia-ink:#3B2100;--t-dia-soft:#3A2B16;--t-dia-glow:rgba(255,181,79,.18);--t-evolucao:#52DBA2;--t-evolucao-ink:#042A1C;--t-evolucao-soft:#15342A;--t-evolucao-glow:rgba(82,219,162,.18);--t-cardapio:#FF8FB7;--t-cardapio-ink:#40081F;--t-cardapio-soft:#3B1B2A;--t-cardapio-glow:rgba(255,143,183,.18);--t-galeria:#6FCDFF;--t-galeria-ink:#052A41;--t-galeria-soft:#13313F;--t-galeria-glow:rgba(111,205,255,.18);}
body{--accent:var(--t-treino);--accent-ink:var(--t-treino-ink);--accent-soft:var(--t-treino-soft);--glow:var(--t-treino-glow)}
body[data-tab="dia"]{--accent:var(--t-dia);--accent-ink:var(--t-dia-ink);--accent-soft:var(--t-dia-soft);--glow:var(--t-dia-glow)}
body[data-tab="evolucao"]{--accent:var(--t-evolucao);--accent-ink:var(--t-evolucao-ink);--accent-soft:var(--t-evolucao-soft);--glow:var(--t-evolucao-glow)}
body[data-tab="cardapio"]{--accent:var(--t-cardapio);--accent-ink:var(--t-cardapio-ink);--accent-soft:var(--t-cardapio-soft);--glow:var(--t-cardapio-glow)}
body[data-tab="galeria"]{--accent:var(--t-galeria);--accent-ink:var(--t-galeria-ink);--accent-soft:var(--t-galeria-soft);--glow:var(--t-galeria-glow)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(140% 52% at 50% -6%,var(--glow),transparent 64%),radial-gradient(circle at 1px 1px,var(--dot) 1.3px,transparent 1.8px) 0 0/16px 16px}
.card{border-top:3px solid var(--tc,var(--accent));box-shadow:0 10px 22px -16px var(--glow)}
.me{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.me .av{box-shadow:0 0 0 2px var(--accent)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pill.today{box-shadow:0 0 0 2px var(--accent-soft)}
.tabs{background:var(--surface);border:1px solid var(--line);padding:3px}
.tabs button{position:relative}
.tabs button[data-t]{box-shadow:inset 0 -3px 0 var(--tb)}
.tabs button[data-t="treino"]{--tb:var(--t-treino);--tbi:var(--t-treino-ink)}
.tabs button[data-t="dia"]{--tb:var(--t-dia);--tbi:var(--t-dia-ink)}
.tabs button[data-t="evolucao"]{--tb:var(--t-evolucao);--tbi:var(--t-evolucao-ink)}
.tabs button[data-t="cardapio"]{--tb:var(--t-cardapio);--tbi:var(--t-cardapio-ink)}
.tabs button[data-t="galeria"]{--tb:var(--t-galeria);--tbi:var(--t-galeria-ink)}
.tabs button[data-t][aria-selected="true"]{background:var(--tb);color:var(--tbi);box-shadow:none}
.dayhead h2{color:var(--accent)}
.fill{background:var(--accent)}
.btn.small[data-act="edit"]{border-color:var(--accent);color:var(--accent)}
.btn{border-color:var(--line)}
.btn.primary{box-shadow:0 8px 16px -10px var(--accent)}

.mealcard{display:flex;flex-direction:column;gap:4px;padding:8px 10px 12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.mrow2{display:flex;align-items:center;gap:6px}
.mrow2 .item{flex:1;min-width:0}
.pen{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.pen svg{width:20px;height:20px}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;padding-left:44px}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);font-variant-numeric:tabular-nums}
.mchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.mchip.kc{--cc:var(--c-corrida)}.mchip.pr{--cc:var(--c-natacao)}.mchip.ed{--cc:var(--c-esporte)}.mchip.empty{--cc:var(--muted);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.mbox .form label{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
/* tela cheia no iPhone: respeita o notch e a barra do relógio */
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh}
body::before{bottom:-200px}
body{padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <button type="button" class="me" id="me" data-act="profile" aria-label="Editar perfil"></button>
    <div class="top">
      <div>
        <div class="eyebrow num" id="range">Semana</div>
        <h1>Treino e Cardápio</h1>
      </div>
      <div class="nav">
        <button type="button" data-act="prev" aria-label="Semana anterior">&#8249;</button>
        <button type="button" data-act="today">Hoje</button>
        <button type="button" data-act="next" aria-label="Próxima semana">&#8250;</button>
      </div>
    </div>
    <div class="weekbar">
      <div class="row"><span>Progresso da semana</span><span class="num" id="wcount"></span></div>
      <div class="track"><div class="fill" id="wfill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="strip" id="strip"></div>
  <main class="panel" id="panel"></main>
  <footer>
    <div class="frow">
      <button type="button" class="btn small" data-act="bkp">Backup dos dados</button>
      <button type="button" class="btn small" data-act="rst">Restaurar dados</button>
      <button type="button" class="btn small" id="exp" data-act="export" hidden>Exportar CSV</button>
    </div>
    <input type="file" id="rstf" accept=".json,application/json" hidden>
    <div id="status">Carregando…</div>
  </footer>
</div>
<div class="mback" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle" tabindex="-1"></div></div>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="af" accept="image/*" hidden>
<input type="file" id="rstz" accept=".zip,application/zip" hidden>

<script>
(function(){
var DIAS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
var SIG=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
var TIPOS={forca:'Musculação',corrida:'Corrida',natacao:'Natação',bike:'Bicicleta',esporte:'Esportes',descanso:'Descanso'};
var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var TICK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
var BASE='2000-01-03';
var HWINS=[['12 sem.',84],['6 meses',182],['Tudo',0]];
var BEM=[['s','Quão bem dormiu hoje?','1 = muito mal · 10 = muito bem','Sono'],
  ['d','Nível de disposição?','1 = sem energia · 10 = muita energia','Disposição'],
  ['e','Nível de esforço no treino?','1 = muito leve · 10 = máximo','Esforço no treino'],
  ['m','Saúde mental de hoje?','1 = muito mal · 10 = muito bem','Saúde mental']];

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dm(t){var d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)}
function dmy(t){var d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function num(s){var x=parseFloat(String(s==null?'':s).replace(',','.'));return isFinite(x)?x:null}
function fmtN(n,dec){var s=n.toFixed(dec);if(s.indexOf('.')>-1)s=s.replace(/\.?0+$/,'');return s.replace('.',',')}
function fmtI(n){return Math.round(n).toLocaleString('pt-BR')}
function parseTime(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  var p=s.split(':').map(function(x){return parseFloat(x.replace(',','.'))});
  for(var i=0;i<p.length;i++)if(!isFinite(p[i])||p[i]<0)return null;
  var t=p.length===1?p[0]*60:p.length===2?p[0]*60+p[1]:p.length===3?p[0]*3600+p[1]*60+p[2]:null;
  return t>0?t:null;
}
function fmtT(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)}

/* Cardio: pace (min/km), velocidade (km/h), ritmo por 100 m. */
function metrics(tipo,lg){
  lg=lg||{};var dist=num(tipo==='natacao'?lg.m:lg.km),t=parseTime(lg.t),pace=null,kmh=null;
  if(dist>0&&t>0){pace=tipo==='natacao'?t/(dist/100):t/dist;if(tipo==='bike')kmh=dist/(t/3600)}
  return {dist:dist,t:t,pace:pace,kmh:kmh};
}
function paceOf(tipo,dist,t){return tipo==='natacao'?t/(dist/100):t/dist}
function calcText(tipo,lg){
  var m=metrics(tipo,lg);
  if(tipo==='esporte'){
    if(m.t==null)return 'Preencha o tempo (e a distância, se quiser).';
    return 'Duração: '+fmtT(m.t)+(m.pace!=null?' · Pace médio: '+fmtT(m.pace)+' /km':'');
  }
  if(m.pace==null)return tipo==='natacao'?'Preencha metros e tempo para ver o ritmo.':'Preencha distância e tempo para ver o pace.';
  if(tipo==='natacao')return 'Ritmo médio: '+fmtT(m.pace)+' /100 m';
  var s='Pace médio: '+fmtT(m.pace)+' /km';
  if(tipo==='bike')s+=' · '+fmtN(m.kmh,1)+' km/h';
  return s;
}

/* Séries de musculação: cada série tem reps e peso. Registros antigos (uma série única) são convertidos na leitura. */
function plannedN(e){return Math.max(1,Math.min(12,parseInt(e.series,10)||3))}
function getSets(l,e){
  if(l&&l.sets)return l.sets;
  var n=plannedN(e),kg=(l&&l.kg)||'',r=(l&&l.r!==undefined)?l.r:(e.reps||'');
  if(l&&l.s)n=Math.max(1,Math.min(12,parseInt(l.s,10)||n));
  var a=[];for(var j=0;j<n;j++)a.push({r:r,kg:kg});return a;
}
function exMax(l,e){var m=null;getSets(l,e).forEach(function(s){var v=num(s.kg);if(v!=null&&v>0&&(m==null||v>m))m=v});return m}

/* Plano de exemplo (ids fixos para os check-ins não se perderem ao recarregar). */
function exMeals(){return [
  {id:'m1',nome:'Café da manhã',desc:'Exemplo: ovos mexidos, pão integral e fruta',kcal:'450',prot:'25'},
  {id:'m2',nome:'Almoço',desc:'Exemplo: arroz, feijão, frango grelhado e salada',kcal:'700',prot:'50'},
  {id:'m3',nome:'Lanche',desc:'Exemplo: iogurte com aveia',kcal:'250',prot:'15'},
  {id:'m4',nome:'Jantar',desc:'Exemplo: omelete com legumes',kcal:'500',prot:'35'}]}
function exW(d,n,tipo,titulo,nota,exs){
  return {id:'s'+d+'w'+n,tipo:tipo,titulo:titulo,nota:nota||'',
    exercicios:(exs||[]).map(function(e,k){return {id:'s'+d+'w'+n+'e'+k,nome:e[0],series:e[1],reps:e[2]}})};
}
function samplePlan(){
  var dias=[
    [exW(0,1,'forca','Peito e tríceps','',[['Supino reto','4','10'],['Crucifixo','3','12'],['Tríceps corda','3','12']])],
    [exW(1,1,'corrida','Corrida leve','Exemplo: 5 km em ritmo confortável')],
    [exW(2,1,'forca','Costas e bíceps','',[['Puxada frontal','4','10'],['Remada baixa','3','12'],['Rosca direta','3','12']])],
    [exW(3,1,'forca','Ombros','',[['Desenvolvimento','4','10'],['Elevação lateral','3','12']]),exW(3,2,'natacao','Natação','Exemplo: 1.000 m, 8 x 100 m')],
    [exW(4,1,'forca','Pernas','',[['Leg press','4','12'],['Agachamento','4','10'],['Cadeira extensora','3','12'],['Panturrilha','4','15']])],
    [exW(5,1,'bike','Bicicleta','Exemplo: 40 min em ritmo moderado')],
    [exW(6,1,'descanso','Descanso','Alongamento leve, se quiser')]];
  return {ex:[0,1,2,3,4,5,6],dias:dias.map(function(t){return {treinos:t,refeicoes:exMeals()}})};
}
function blankDia(){return {treinos:[],refeicoes:[]}}

/* Armazenamento: conta do viewer (db) quando disponível, senão este navegador. */
var store={mode:'local',col:null,
  init:function(){
    var self=this;
    try{
      if(!window.claude||!window.claude.use)return Promise.resolve();
      return Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]).then(function(r){
        state.dl=r[2]||null;
        var db=r[0],user=r[1];if(!db||!user)return;
        return user.id().then(function(id){if(id){self.col=db.collection('data/users/'+id);self.mode='cloud'}});
      }).catch(function(){});
    }catch(e){return Promise.resolve()}},
  get:function(name){
    if(this.mode==='cloud')return this.col.doc(name).get().then(function(s){return s.exists?clone(s.data()):null});
    try{var v=localStorage.getItem('treino:'+name);return Promise.resolve(v?JSON.parse(v):null)}catch(e){return Promise.resolve(null)}},
  set:function(name,obj){
    if(this.mode==='cloud')return this.col.doc(name).set(obj);
    try{localStorage.setItem('treino:'+name,JSON.stringify(obj))}catch(e){return Promise.reject(e)}
    return Promise.resolve()},
  all:function(){
    var out={};
    if(this.mode==='cloud')return this.col.get().then(function(snap){snap.docs.forEach(function(d){out[d.id]=clone(d.data())});return out});
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('treino:')===0)out[k.slice(7)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
    return Promise.resolve(out)},
  weeks:function(){
    var out={};
    if(this.mode==='cloud')return this.col.get().then(function(snap){snap.docs.forEach(function(d){if(d.id.indexOf('w-')===0)out[d.id.slice(2)]=clone(d.data())});return out});
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('treino:w-')===0)out[k.slice(9)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
    return Promise.resolve(out);}};

var today=new Date();
var state={plan:{versoes:{}},planLoaded:false,weekStart:mondayOf(today),sel:(today.getDay()+6)%7,
  weeks:{},loaded:{},editing:false,draft:null,tab:'treino',hist:{ex:{},c:{},bw:{},w:{}},histNew:false,config:{},hwin:84,dl:null,applyAll:true,perfil:{nome:'',foto:''},pk:{},idb:false,gal:{y:today.getFullYear(),m:today.getMonth()},pend:null,pdraft:null,murls:[],turl:{},msg:''};
state.plan.versoes[BASE]=samplePlan();

var q=Promise.resolve(),lastHist='';
function setStatus(k){
  var el=document.getElementById('status');
  var where=store.mode==='cloud'?'Salvo na sua conta do Claude.':'Salvo só neste aparelho. Faça backup de vez em quando.';
  el.textContent=k==='saving'?'Salvando…':k==='err'?'Não foi possível salvar. Tente de novo.':k==='csv'?'Arquivo CSV pronto.':k==='csverr'?'Não foi possível exportar.':k==='msg'?state.msg:k==='foto'?'Foto salva neste aparelho.':k==='fotoerr'?'Não foi possível salvar a foto.':k==='fotoempty'?'Nenhuma foto para o backup.':k==='bk'?'Backup pronto. Guarde o arquivo.':k==='bkerr'?'Nada para salvar ou falha no backup.':k==='rsterr'?'Arquivo de backup inválido.':(state.planLoaded?where:'Carregando…');
}
function chain(fn){setStatus('saving');q=q.then(fn).then(function(){setStatus('ok')},function(){setStatus('err')});return q}
var timers={};
function persistWeek(k){
  clearTimeout(timers[k]);
  timers[k]=setTimeout(function(){
    reindexWeek(k);
    chain(function(){return store.set('w-'+k,state.weeks[k])});
    var hs=JSON.stringify(state.hist);
    if(hs!==lastHist){lastHist=hs;chain(function(){return store.set('hist',state.hist)})}
  },350);
  setStatus('saving');
}
function persistPlan(){return chain(function(){return store.set('plano',{v:2,versoes:state.plan.versoes})})}
var cfgTimer=null;
function persistConfig(){clearTimeout(cfgTimer);cfgTimer=setTimeout(function(){chain(function(){return store.set('config',state.config)})},400);setStatus('saving')}

/* Plano recorrente: cada versão vale da semana indicada em diante, até a próxima versão. */
function planFor(wk){
  var ks=Object.keys(state.plan.versoes).sort(),pick=ks[0];
  ks.forEach(function(k){if(k<=wk)pick=k});
  return state.plan.versoes[pick];
}
function normalizePlan(){
  Object.keys(state.plan.versoes).forEach(function(k){
    var v=state.plan.versoes[k];
    if(!v.dias)v.dias=[];
    while(v.dias.length<7)v.dias.push(blankDia());
    v.dias.forEach(function(d){
      d.treinos=d.treinos||[];d.refeicoes=d.refeicoes||[];
      d.treinos.forEach(function(w){w.exercicios=w.exercicios||[];w.nota=w.nota||''});
    });
  });
}
function migrateV1(p){
  return {dias:p.dias.map(function(d){
    return {treinos:[{id:'w1',tipo:d.tipo||'descanso',titulo:d.titulo||'',nota:d.detalhe||'',exercicios:[]}],refeicoes:d.refeicoes||[]};
  })};
}

function wkey(){return ymd(state.weekStart)}
function pkey(){return ymd(addDays(state.weekStart,-7))}
function weekDoc(){var k=wkey();if(!state.weeks[k])state.weeks[k]={v:2,f:{},d:{}};var w=state.weeks[k];w.f=w.f||{};w.d=w.d||{};w.n=w.n||{};w.b=w.b||{};w.g=w.g||{};w.o=w.o||{};return w}
function logs(k){return (state.weeks[k]&&state.weeks[k].d)||{}}
function checks(k){return (state.weeks[k]&&state.weeks[k].f)||{}}

/* Índice de histórico (doc "hist"): maior peso por exercício e data, sessões de cardio e peso corporal. Refeito a cada semana salva. */
function normHist(){var h=state.hist;h.ex=h.ex||{};h.c=h.c||{};h.bw=h.bw||{};h.w=h.w||{}}
function nthOfType(treinos,w){var n=0;for(var k=0;k<treinos.length;k++){if(treinos[k].tipo===w.tipo){if(treinos[k]===w)return n;n++}}return n}
function reindexWeek(wk){
  normHist();var h=state.hist,ws=parseYmd(wk),dates=[],i;
  for(i=0;i<7;i++)dates.push(ymd(addDays(ws,i)));
  Object.keys(h.ex).forEach(function(nm){dates.forEach(function(d){delete h.ex[nm].p[d]});if(!Object.keys(h.ex[nm].p).length)delete h.ex[nm]});
  Object.keys(h.c).forEach(function(tp){Object.keys(h.c[tp]).forEach(function(key){if(dates.indexOf(key.split('#')[0])>-1)delete h.c[tp][key]})});
  delete h.bw[wk];dates.forEach(function(d){delete h.w[d]});
  var plan=planFor(wk),lg=logs(wk),doc=state.weeks[wk]||{};
  for(i=0;i<7;i++){
    (function(i){
      var dia=plan.dias[i],date=dates[i];
      dia.treinos.forEach(function(w){
        if(w.tipo==='forca'){
          w.exercicios.forEach(function(e){
            var l=lg[i+':'+e.id];if(!l)return;
            var mk=exMax(l,e);if(!(mk>0))return;
            var nm=norm(e.nome);if(!nm)return;
            h.ex[nm]=h.ex[nm]||{n:e.nome,p:{}};h.ex[nm].n=e.nome;
            h.ex[nm].p[date]=Math.max(h.ex[nm].p[date]||0,mk);
          });
        }else if(w.tipo==='corrida'||w.tipo==='bike'||w.tipo==='natacao'||w.tipo==='esporte'){
          var m=metrics(w.tipo,lg[i+':'+w.id]);
          if((m.dist>0&&m.t>0)||(w.tipo==='esporte'&&m.t>0)){h.c[w.tipo]=h.c[w.tipo]||{};h.c[w.tipo][date+'#'+nthOfType(dia.treinos,w)]={d:m.dist>0?m.dist:0,t:Math.round(m.t)}}
        }
      });
    })(i);
  }
  var b=num(doc.bw);if(b>0)h.bw[wk]=b;
  var wb=doc.b||{};
  for(i=0;i<7;i++){
    var o=wb[i];if(!o)continue;
    var rec={};BEM.forEach(function(q){var v=num(o[q[0]]);if(v>=1&&v<=10)rec[q[0]]=v});
    if(Object.keys(rec).length)h.w[dates[i]]=rec;
  }
}

function itemKeys(dia,i){
  var a=[];
  dia.treinos.forEach(function(w){
    if(w.tipo==='forca'&&w.exercicios.length)w.exercicios.forEach(function(e){a.push(i+':'+e.id)});
    else a.push(i+':'+w.id);
  });
  dia.refeicoes.forEach(function(m){a.push(i+':'+m.id)});
  return a;
}
function dayCount(i){
  var wk=wkey(),f=checks(wk),ks=itemKeys(planFor(wk).dias[i],i),n=0;
  ks.forEach(function(k){if(f[k])n++});
  return [n,ks.length];
}

function render(){
  var ws=state.weekStart,we=addDays(ws,6);
  document.getElementById('range').textContent='Semana de '+ws.getDate()+' '+MES[ws.getMonth()]+' a '+we.getDate()+' '+MES[we.getMonth()];
  var tn=0,tt=0,strip='',plan=planFor(wkey());
  for(var i=0;i<7;i++){
    var c=dayCount(i),d=addDays(ws,i),dia=plan.dias[i],isT=ymd(d)===ymd(today),dots='',seen={};
    dia.treinos.forEach(function(w){if(!seen[w.tipo]){seen[w.tipo]=1;dots+='<i style="--tc:var(--c-'+w.tipo+')"></i>'}});
    tn+=c[0];tt+=c[1];
    var tipos=dia.treinos.map(function(w){return TIPOS[w.tipo]}).join(' e ')||'sem treino';
    strip+='<button type="button" class="pill'+(isT?' today':'')+'" data-act="sel" data-i="'+i+'" aria-pressed="'+(state.sel===i)+'" aria-label="'+DIAS[i]+', '+d.getDate()+' de '+MES[d.getMonth()]+', '+tipos+', '+c[0]+' de '+c[1]+' feitos">'
      +'<span class="sig">'+SIG[i]+'</span><span class="d num">'+d.getDate()+'</span><span class="dots">'+dots+'</span>'
      +'<span class="mini"><b style="width:'+(c[1]?Math.round(c[0]/c[1]*100):0)+'%"></b></span></button>';

function exBaseline(nm,date){
  var h=state.hist.ex[nm];if(!h)return null;var m=null;

}
function exPR(e,date,l){

function cardioPR(tp,date,m){
  var h=state.hist.c[tp];if(!h||!(m.dist>0&&m.t>0))return '';
  var bp=null,bd=null;
  Object.keys(h).forEach(function(key){
    if(key.split('#')[0]===date)return;
    var s=h[key];if(!(s.d>0))return;
    var p=paceOf(tp,s.d,s.t);
    if(bp==null||p<bp)bp=p;if(bd==null||s.d>bd)bd=s.d;
  });
  var out='';
  if(bp!=null&&m.pace<bp)out+='<span class="prchip">Melhor '+(tp==='natacao'?'ritmo':'pace')+'</span> ';
  if(bd!=null&&m.dist>bd)out+='<span class="prchip">Maior distância</span>';
  return out;
}

/* Quadro de evolução: só os tipos de treino presentes no dia selecionado. */
function deltaN(c,p,dec,unit,better){
  if(c==null||p==null)return '<span class="neu">—</span>';
  var d=c-p;if(Math.abs(d)<Math.pow(10,-dec)/2)return '<span class="neu">= igual</span>';
  var cls=better==='up'?(d>0?'good':'bad'):'neu';
  return '<span class="'+cls+'">'+(d>0?'▲ +':'▼ −')+fmtN(Math.abs(d),dec)+(unit?' '+unit:'')+'</span>';
}
function deltaT(c,p,better){
  if(c==null||p==null)return '<span class="neu">—</span>';
  var d=c-p;if(Math.abs(d)<0.5)return '<span class="neu">= igual</span>';
  var cls=better==='down'?(d<0?'good':'bad'):'neu';
  return '<span class="'+cls+'">'+(d>0?'▲ +':'▼ −')+fmtT(Math.abs(d))+'</span>';
}
function erow(label,pv,cv,dh){return '<div class="er"><span class="en">'+esc(label)+'</span><span class="num">'+pv+'</span><span class="num">'+cv+'</span><span class="num">'+dh+'</span></div>'}

/* Gráficos de linha (uma série por gráfico, cor do tipo de treino). Ponto de melhor marca destacado; toque ou passe o cursor para ver valores; tabela de valores abaixo. */
var chartN=0;
function chart(pts,o){
  if(pts.length<2){
    return '<div class="prev">'+(pts.length?'Só há um registro ('+esc(o.fmt(pts[0].v))+' em '+dm(pts[0].t)+'). Registre outra data para ver a evolução.':'Sem registros neste período.')+'</div>';
  }
  var W=320,H=124,L=44,R=12,T=10,B=24,id='ch'+(++chartN),t0=pts[0].t,t1=pts[pts.length-1].t,vmin=Infinity,vmax=-Infinity,bi=0;
  pts.forEach(function(p,k){if(p.v<vmin)vmin=p.v;if(p.v>vmax)vmax=p.v});
  if(o.best==='last')bi=pts.length-1;
  else pts.forEach(function(p,k){if(o.best==='min'?p.v<pts[bi].v:p.v>pts[bi].v)bi=k});
  var lo=vmin,hi=vmax;if(hi-lo<1e-9){lo-=1;hi+=1}
  var pad=(hi-lo)*0.12,ylo=lo-pad,yhi=hi+pad;
  if(o.ylo!=null){ylo=o.ylo;yhi=o.yhi}
  function X(t){return L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R)}
  function Y(v){return T+(1-(v-ylo)/(yhi-ylo))*(H-T-B)}
  var ticks=o.ticks||(vmax-vmin<1e-9?[vmin]:[vmin,(vmin+vmax)/2,vmax]);
  var s='<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+': '+esc(o.fmt(pts[0].v))+' em '+dm(t0)+' até '+esc(o.fmt(pts[pts.length-1].v))+' em '+dm(t1)+', '+pts.length+' registros">';
  ticks.forEach(function(v){var y=Y(v).toFixed(1);s+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(L-6)+'" y="'+(+y+3.5).toFixed(1)+'" text-anchor="end">'+esc(o.fmt(v))+'</text>'});
  s+='<path class="ln" d="'+pts.map(function(p,k){return (k?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)}).join('')+'"/>';
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'"/>';
  var data=[];
  pts.forEach(function(p,k){
    var x=X(p.t).toFixed(1),y=Y(p.v).toFixed(1);
    s+='<circle class="'+(k===bi?'pr':'pt')+'" cx="'+x+'" cy="'+y+'" r="'+(k===bi?5.5:4)+'"/>';
    data.push({x:+x,y:+y,l:dmy(p.t),v:o.fmt(p.v)});
  });
  s+='<circle class="hl" cx="0" cy="0" r="7"/>';
  s+='<text class="tx" x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+dm(t0)+'</text><text class="tx" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dm(t1)+'</text></svg>';
  s=s.replace('<svg class="chart"','<svg class="chart" data-pts="'+esc(JSON.stringify(data))+'"');
  var last=pts[pts.length-1],bp=pts[bi];
  var def='Último: '+o.fmt(last.v)+' em '+dm(last.t)+(o.best==='last'?'':' · Melhor: '+o.fmt(bp.v)+' em '+dm(bp.t));
  var rows=pts.slice(-30).reverse().map(function(p){return '<tr><td>'+dmy(p.t)+'</td><td>'+esc(o.fmt(p.v))+'</td></tr>'}).join('');
  return s+'<div class="ro" id="ro-'+id+'" data-def="'+esc(def)+'">'+esc(def)+'</div>'
    +'<details class="vals"><summary>Ver valores</summary><table><thead><tr><th>Data</th><th>'+esc(o.col||'Valor')+'</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}
function onChartPointer(e){
  var svg=e.target&&e.target.closest&&e.target.closest('svg.chart');if(!svg)return;
  var pts;try{pts=JSON.parse(svg.getAttribute('data-pts'))}catch(x){return}
  var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;if(!r.width)return;
  var x=(e.clientX-r.left)/r.width*vb.width,bi=0,bd=1e9;
  pts.forEach(function(p,k){var d=Math.abs(p.x-x);if(d<bd){bd=d;bi=k}});
  var p=pts[bi],xh=svg.querySelector('.xh'),hl=svg.querySelector('.hl');
  xh.setAttribute('x1',p.x);xh.setAttribute('x2',p.x);xh.style.visibility='visible';
  hl.setAttribute('cx',p.x);hl.setAttribute('cy',p.y);hl.style.visibility='visible';
  var ro=document.getElementById('ro-'+svg.id);if(ro)ro.textContent=p.l+' · '+p.v;
}

/* Exportação em CSV (separador ponto e vírgula, vírgula decimal, abre direto no Excel em português). */
function csvEsc(v){v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildRows(weeks){
  var R=[['Data','Dia','Tipo','Treino','Item','Série','Reps','Peso (kg)','Distância','Unidade','Tempo','Pace / ritmo','Kcal','Proteína (g)','Feito','Observação']];
  function c(v){return v==null?'':String(v).replace('.',',')}
  Object.keys(weeks).sort().forEach(function(wk){
    var wd=weeks[wk],f=wd.f||{},d=wd.d||{},n=wd.n||{},plan=planFor(wk),ws=parseYmd(wk);
    for(var i=0;i<7;i++){
      (function(i){
        var date=ymd(addDays(ws,i)),dia=plan.dias[i],dn=DIAS[i];
        dia.treinos.forEach(function(w){
          var tt=TIPOS[w.tipo],tl=w.titulo||tt;
          if(w.tipo==='forca'&&w.exercicios.length){
            w.exercicios.forEach(function(e){
              var k=i+':'+e.id,l=d[k],done=f[k]?'Sim':'Não',any=false;
              if(l)getSets(l,e).forEach(function(s,j){if(s.kg){any=true;R.push([date,dn,tt,tl,e.nome,j+1,c(s.r),c(s.kg),'','','','','','',done,''])}});
              if(!any&&f[k])R.push([date,dn,tt,tl,e.nome,'','','','','','','','','',done,'']);
            });
          }else{
            var k2=i+':'+w.id,l2=d[k2],isC=w.tipo==='corrida'||w.tipo==='bike'||w.tipo==='natacao'||w.tipo==='esporte';
            if(!l2&&!f[k2])return;
            var m=isC?metrics(w.tipo,l2):{},pace=m.pace!=null?fmtT(m.pace)+(w.tipo==='natacao'?' /100 m':' /km'):'';
            R.push([date,dn,tt,tl,tl,'','','',isC&&m.dist!=null?c(m.dist):'',isC?(w.tipo==='natacao'?'m':'km'):'',l2&&l2.t?l2.t:'',pace,'','',f[k2]?'Sim':'Não','']);
          }
        });
        dia.refeicoes.forEach(function(m0){var m=mealEffFrom(wd,i,m0),k=i+':'+m.id;if(f[k])R.push([date,dn,'Refeição','',m.nome,'','','','','','','',c(m.kcal),c(m.prot),'Sim','']) });
        if(n[i])R.push([date,dn,'Observação','','','','','','','','','','','','',n[i]]);
        var wb=(wd.b||{})[i];
        if(wb)BEM.forEach(function(q){if(wb[q[0]]!=null){var r=[date,dn,'Bem-estar','',q[1]];while(r.length<16)r.push('');r.push(wb[q[0]]);R.push(r)}});
      })(i);
    }
    if(num(wd.bw)>0)R.push([wk,'','Peso corporal','','Peso da semana','','',c(wd.bw),'','','','','','','','']);
  });
  R[0].push('Nota (1 a 10)');
  for(var z=1;z<R.length;z++)while(R[z].length<17)R[z].push('');
  return R;
}
function exportCSV(){
  if(!state.dl)return;
  store.weeks().then(function(weeks){
    var rows=buildRows(weeks);
    if(rows.length<2){setStatus('csverr');return}
    var text='﻿'+rows.map(function(r){return r.map(csvEsc).join(';')}).join('\r\n');
    return state.dl.save({filename:'treino-e-cardapio-'+ymd(new Date())+'.csv',data:text}).then(function(){setStatus('csv')});
  }).catch(function(e){if(e&&e.code==='declined')return;setStatus('csverr')});
}

function loadImg(blob){return new Promise(function(res,rej){
  var u=URL.createObjectURL(blob),im=new Image();
  im.onload=function(){URL.revokeObjectURL(u);res(im)};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('imagem'))};
  im.src=u;
})}
function drawJpeg(im,max,q,square){
  var w=im.naturalWidth,h=im.naturalHeight,sx=0,sy=0,sw=w,sh=h,cw,ch;
  if(square){var m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;cw=ch=max}
  else{var k=Math.min(1,max/Math.max(w,h));cw=Math.max(1,Math.round(w*k));ch=Math.max(1,Math.round(h*k))}
  var c=document.createElement('canvas');c.width=cw;c.height=ch;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
  return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)});
}
function processImage(file){
  return loadImg(file).then(function(im){
    return drawJpeg(im,1080,0.78).then(function(full){
      return drawJpeg(im,240,0.7).then(function(th){return {full:full,thumb:th}});
    });
  });
}

/* Perfil: foto e nome */
function avHTML(p,big){
  return '<span class="av'+(big?' big':'')+'">'+(p.foto?'<img src="'+p.foto+'" alt="">':(p.nome&&p.nome.trim()?esc(p.nome.trim().charAt(0).toUpperCase()):PERSON))+'</span>';
}
function updateMe(){
  var el=document.getElementById('me');if(!el)return;
  var p=state.perfil;
  el.innerHTML=avHTML(p)+'<span class="mename'+(p.nome?'':' empty')+'">'+esc(p.nome||'Seu nome')+'</span>';
}
function openProfile(keep){
  if(!keep||!state.pdraft)state.pdraft={nome:state.perfil.nome||'',foto:state.perfil.foto||''};
  var p=state.pdraft;
  openModal('<h2 id="mtitle" class="mt">Seu perfil</h2><div class="pcen">'+avHTML(p,true)+'</div>'
    +'<div class="bar" style="justify-content:center"><button type="button" class="btn small" data-act="pavatar">Escolher foto</button>'
    +(p.foto?'<button type="button" class="btn small" data-act="prem">Remover foto</button>':'')+'</div>'
    +'<label class="fld" for="pn">Seu nome<input type="text" id="pn" data-pn="1" maxlength="30" value="'+esc(p.nome)+'" placeholder="Como quer ser chamado" autocomplete="off"></label>'
    +'<button type="button" class="btn primary" data-act="psave">Salvar</button>'
    +'<button type="button" class="btn" data-act="mclose">Cancelar</button>');
}
function saveProfile(){
  if(!state.pdraft)return;
  state.perfil={nome:(state.pdraft.nome||'').trim(),foto:state.pdraft.foto||''};
  closeModal();updateMe();
  chain(function(){return store.set('perfil',state.perfil)});
}
document.getElementById('af').addEventListener('change',function(e){
  var file=e.target.files[0],input=e.target;
  function clear(){input.value=''}
  if(!file||!state.pdraft){clear();return}
  loadImg(file).then(function(im){return drawJpeg(im,256,0.8,true)}).then(function(b){
    return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(fr.error)};fr.readAsDataURL(b)});
  }).then(function(u){if(state.pdraft){state.pdraft.foto=u;openProfile(true)}}).then(clear,function(){clear();setStatus('fotoerr')});
});

/* Foto de treino: escolher/tirar, salvar, ver, apagar */
function askPhoto(date,wid,label){
  state.pend={date:date,wid:wid,label:label||'Foto'};
  document.getElementById('pf').click();
}
document.getElementById('pf').addEventListener('change',function(e){
  var file=e.target.files[0],input=e.target,c=state.pend;
  function clear(){input.value=''}
  if(!file||!c){clear();return}
  state.pend=null;state.msg='Salvando foto…';setStatus('msg');
  var key=pkey2(c.date,c.wid);
  processImage(file).then(function(r){
    return photos.put({key:key,date:c.date,wid:c.wid,label:c.label,ts:Date.now(),thumb:r.thumb},r.full);
  }).then(function(){
    if(state.turl[key]){URL.revokeObjectURL(state.turl[key]);delete state.turl[key]}
    state.pk[key]=true;closeModal();render();setStatus('foto');clear();
  },function(){clear();setStatus('fotoerr')});
});
function viewPhoto(key){
  Promise.all([photos.getMeta(key),photos.getFull(key)]).then(function(r){
    var m=r[0],f=r[1];if(!m||!f){setStatus('fotoerr');return}
    var u=URL.createObjectURL(f.blob),d=parseYmd(m.date);state.murls.push(u);
    openModal('<h2 id="mtitle" class="mt">'+esc(m.label)+'</h2><div class="sub num">'+d.getDate()+' de '+MESL[d.getMonth()]+' de '+d.getFullYear()+'</div>'
      +'<img class="big" src="'+u+'" alt="Foto do treino '+esc(m.label)+'">'
      +'<button type="button" class="btn primary" data-act="phadd" data-date="'+m.date+'" data-wid="'+esc(m.wid)+'" data-lab="'+esc(m.label)+'">Trocar foto</button>'
      +'<button type="button" class="btn" data-act="phdel" data-pk="'+esc(key)+'">Apagar foto</button>'
      +'<button type="button" class="btn" data-act="mclose">Fechar</button>');
  }).catch(function(){setStatus('fotoerr')});
}
function delPhoto(key){
  if(!confirm('Apagar esta foto? Não dá para desfazer.'))return;
  photos.del(key).then(function(){
    if(state.turl[key]){URL.revokeObjectURL(state.turl[key]);delete state.turl[key]}
    delete state.pk[key];closeModal();render();
  }).catch(function(){setStatus('fotoerr')});
}
function showCongrats(w,date){
  var label=w.titulo||TIPOS[w.tipo],has=!!state.pk[pkey2(date,w.id)];
  var h='<div class="cg"><div class="cgi">'+TICK+'</div><h2 id="mtitle" class="mt">Parabéns pelo treino!</h2><div class="sub">'+esc(label)+' concluído. Bom trabalho!</div></div>';

/*ZIP-START*/
var CRC=null;
function crc32(u8){
  if(!CRC){CRC=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC[n]=c>>>0}}
  var x=0xFFFFFFFF;for(var i=0;i<u8.length;i++)x=CRC[(x^u8[i])&255]^(x>>>8);
  return (x^0xFFFFFFFF)>>>0;
}
function ZipW(){this.parts=[];this.cen=[];this.off=0;this.n=0}
ZipW.prototype.add=function(name,u8,ts){
  var nb=new TextEncoder().encode(name),d=new Date(ts||Date.now()),crc=crc32(u8);
  var tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  var h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
  h.setUint32(14,crc,true);h.setUint32(18,u8.length,true);h.setUint32(22,u8.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
  var c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
  c.setUint32(16,crc,true);c.setUint32(20,u8.length,true);c.setUint32(24,u8.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,this.off,true);
  this.parts.push(h.buffer,nb,u8);this.cen.push(c.buffer,nb);
  this.off+=30+nb.length+u8.length;this.n++;
};
ZipW.prototype.blob=function(){
  var cs=0;this.cen.forEach(function(x){cs+=x.byteLength});
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,this.n,true);e.setUint16(10,this.n,true);e.setUint32(12,cs,true);e.setUint32(16,this.off,true);
  return new Blob(this.parts.concat(this.cen,[e.buffer]),{type:'application/zip'});
};
function zipRead(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),i=u8.length-22,min=Math.max(0,u8.length-65557);
  while(i>=min&&dv.getUint32(i,true)!==0x06054b50)i--;
  if(i<min)throw new Error('zip');
  var n=dv.getUint16(i+10,true),p=dv.getUint32(i+16,true),out=[],td=new TextDecoder();
  for(var k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('zip');
    var nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    out.push({name:td.decode(u8.subarray(p+46,p+46+nl)),method:dv.getUint16(p+10,true),csize:dv.getUint32(p+20,true),usize:dv.getUint32(p+24,true),off:dv.getUint32(p+42,true)});
    p+=46+nl+el+cl;
  }
  return out;
}
function zipData(buf,e){
  var dv=new DataView(buf),u8=new Uint8Array(buf),o=e.off;
  if(dv.getUint32(o,true)!==0x04034b50)return Promise.reject(new Error('zip'));
  var s=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true),raw=u8.subarray(s,s+e.csize);
  if(e.method===0)return Promise.resolve(raw);
  if(e.method===8&&typeof DecompressionStream!=='undefined'){
    var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
    w.write(raw);w.close();
    return new Response(ds.readable).arrayBuffer().then(function(b){return new Uint8Array(b)});
  }
  return Promise.reject(new Error('método de compactação não suportado'));
}

function backupFotos(){
  photos.allMeta().then(function(metas){
    if(!metas.length){setStatus('fotoempty');return}
    metas.sort(function(a,b){return a.key<b.key?-1:1});
    var z=new ZipW(),idx=[],used={},i=0;
    return metas.reduce(function(p,m){
      return p.then(function(){
        return photos.getFull(m.key).then(function(r){
          if(!r)return;
          return r.blob.arrayBuffer().then(function(ab){
            var base=m.date+'_'+slugify(m.label||m.wid),nm=base+'.jpg',c=1;
            while(used[nm]){c++;nm=base+'-'+c+'.jpg'}
            used[nm]=1;
            z.add(nm,new Uint8Array(ab),m.ts);
            idx.push({file:nm,key:m.key,date:m.date,wid:m.wid,label:m.label,ts:m.ts});
            i++;state.msg='Preparando backup… '+i+'/'+metas.length;setStatus('msg');
          });
        });
      });
    },Promise.resolve()).then(function(){
      z.add('fotos.json',new TextEncoder().encode(JSON.stringify({app:'treino-e-cardapio-fotos',v:1,fotos:idx})),Date.now());
      return saveFile('backup-fotos-'+ymd(new Date())+'.zip',z.blob(),'application/zip');
    }).then(function(){state.msg='Backup das fotos pronto. Guarde o arquivo.';setStatus('msg')});
  }).catch(function(e){
    if(e&&e.name==='AbortError')return;
    state.msg='Não foi possível fazer o backup das fotos.';setStatus('msg');
  });
}
function restoreFotos(file){
  if(!file)return;
  state.msg='Lendo arquivo…';setStatus('msg');
  file.arrayBuffer().then(function(buf){
    var ents=zipRead(buf),by={};
    ents.forEach(function(e){by[e.name]=e});
    var idxP=by['fotos.json']?zipData(buf,by['fotos.json']).then(function(u){try{return JSON.parse(new TextDecoder().decode(u))}catch(x){return null}}):Promise.resolve(null);
    return idxP.then(function(ix){
      var map={};if(ix&&ix.fotos)ix.fotos.forEach(function(m){map[m.file]=m});
      var imgs=ents.filter(function(e){return /\.(jpe?g|png|webp)$/i.test(e.name)});
      if(!imgs.length)throw new Error('sem fotos');
      if(!confirm('Restaurar '+imgs.length+' foto(s)? As que já existem no mesmo dia e treino são mantidas.')){setStatus('ok');return}
      var done=0,added=0,skipped=0;
      return imgs.reduce(function(p,e){
        return p.then(function(){
          var base=e.name.split('/').pop(),m=map[e.name]||map[base]||null,dm2=/^(\d{4}-\d{2}-\d{2})/.exec(base);
          var date=m?m.date:(dm2?dm2[1]:null);
          done++;state.msg='Restaurando fotos… '+done+'/'+imgs.length;setStatus('msg');
          if(!date){skipped++;return}
          var plain=base.replace(/\.[^.]+$/,''),wid=m?m.wid:'x-'+slugify(plain),key=m?m.key:pkey2(date,wid);
          if(state.pk[key]){skipped++;return}
          return zipData(buf,e).then(function(u){
            var blob=new Blob([u],{type:'image/jpeg'});
            return loadImg(blob).then(function(im){
              var fullP=m?Promise.resolve(blob):drawJpeg(im,1080,0.78);
              return fullP.then(function(full){
                return drawJpeg(im,240,0.7).then(function(th){
                  return photos.put({key:key,date:date,wid:wid,label:m?m.label:plain,ts:m?m.ts:Date.now(),thumb:th},full);
                });
              });
            });
          }).then(function(){state.pk[key]=true;added++},function(){skipped++});
        });
      },Promise.resolve()).then(function(){
        state.msg='Fotos restauradas: '+added+(skipped?' · '+skipped+' ignorada(s) ou já existentes':'')+'.';
        setStatus('msg');render();
      });
    });
  }).catch(function(){state.msg='Arquivo de fotos inválido.';setStatus('msg')});
}

function delWorkout(wid,sc){
  var wk=wkey(),di=state.sel,cur=planFor(wk),prevEff=clone(cur),nd=clone(cur),wasEx=(cur.ex||[]).indexOf(di)>-1;
  nd.dias[di].treinos=nd.dias[di].treinos.filter(function(w){return w.id!==wid});
  nd.ex=(cur.ex||[]).filter(function(n){return n!==di});if(!nd.ex.length)delete nd.ex;
  state.plan.versoes[wk]=nd;

      if(k<=wk)return;
      var v=state.plan.versoes[k];

    });

function saveFile(name,text,type){
  if(state.dl)return state.dl.save({filename:name,data:text});
  var blob=(text instanceof Blob)?text:new Blob([text],{type:type});
  try{var f=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]}).catch(function(e){if(e&&e.name==='AbortError')return;throw e})}catch(e){}
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);return Promise.resolve()}
function backup(){
  store.all().then(function(d){
    if(!Object.keys(d).length){setStatus('bkerr');return}
    var txt=JSON.stringify({app:'treino-e-cardapio',v:1,data:d});
    return saveFile('backup-treino-'+ymd(new Date())+'.json',txt,'application/json').then(function(){setStatus('bk')});
  }).catch(function(e){if(e&&(e.code==='declined'))return;setStatus('bkerr')});
}
function restoreFile(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result)}catch(e){}
    if(!j||j.app!=='treino-e-cardapio'||!j.data){setStatus('rsterr');return}
    var names=Object.keys(j.data);
    if(!confirm('Restaurar '+names.length+' registros? Isso substitui os dados atuais com os mesmos nomes.'))return;
    var p=Promise.resolve();
    names.forEach(function(n){p=p.then(function(){return store.set(n,j.data[n])})});
    p.then(function(){location.reload()},function(){setStatus('rsterr')});
  };
  rd.readAsText(file);
}

document.addEventListener('click',function(e){

  if(a==='phdel')return delPhoto(el.getAttribute('data-pk'));
  if(a==='zbkp')return backupFotos();
  if(a==='zrst')return document.getElementById('rstz').click();
  if(a==='bkp')return backup();
  if(a==='rst')return document.getElementById('rstf').click();
  if(a==='scale'){
    var wk1=wkey();if(!state.loaded[wk1])return;
    var bb=weekDoc().b,bi=state.sel,qk=el.getAttribute('data-q'),bv=+el.getAttribute('data-v');
    bb[bi]=bb[bi]||{};
    if(bb[bi][qk]===bv)delete bb[bi][qk];else bb[bi][qk]=bv;
    if(!Object.keys(bb[bi]).length)delete bb[bi];
    persistWeek(wk1);return render();
  }
  if(a==='toggle'){
    var k=wkey();if(!state.loaded[k])return;
    var key=el.getAttribute('data-key'),f=weekDoc().f;
    var wasOn=!!f[key];
    if(wasOn)delete f[key];else f[key]=true;
    var fin=null;
    if(!wasOn){
      var dd=weekDoc(),di=state.sel;
      planFor(k).dias[di].treinos.forEach(function(w){
        if(fin||w.tipo==='descanso')return;
        var ks=(w.tipo==='forca'&&w.exercicios.length)?w.exercicios.map(function(e){return di+':'+e.id}):[di+':'+w.id];
        if(ks.indexOf(key)>-1&&ks.every(function(x){return f[x]})&&!dd.g[di+':'+w.id]){dd.g[di+':'+w.id]=true;fin=w}
      });
    }
    persistWeek(k);render();
    if(fin)showCongrats(fin,ymd(addDays(state.weekStart,state.sel)));
    return;
  }
  if(a==='addset'||a==='delset'){
    var wk0=wkey();if(!state.loaded[wk0])return;
    var sk=el.getAttribute('data-k'),l=ensureSets(sk);
    if(a==='addset'){var last=l.sets[l.sets.length-1]||{};l.sets.push({r:last.r||'',kg:''})}
    else if(l.sets.length>1)l.sets.pop();
    persistWeek(wk0);return render();
  }
  if(a==='edit'){
    var dia=planFor(wkey()).dias[state.sel];
    state.draft={treinos:clone(dia.treinos),refeicoes:clone(dia.refeicoes),escopo:'sempre',copy:false};
    state.editing=true;return render();
  }
  if(a==='cancel'){state.editing=false;return render()}
  if(a==='wtype'){dr.treinos[wi].tipo=el.getAttribute('data-t');return render()}
  if(a==='addw'){dr.treinos.push({id:uid(),tipo:'forca',titulo:'',nota:'',exercicios:[]});render();
    var t=document.getElementById('wt-'+(dr.treinos.length-1));if(t)t.focus();return}
  if(a==='delw'){dr.treinos.splice(wi,1);return render()}
  if(a==='adde'){dr.treinos[wi].exercicios.push({id:uid(),nome:'',series:'3',reps:'12'});render();
    var x=document.getElementById('en-'+wi+'-'+(dr.treinos[wi].exercicios.length-1));if(x)x.focus();return}
  if(a==='dele'){dr.treinos[wi].exercicios.splice(ei,1);return render()}
  if(a==='addmeal'){dr.refeicoes.push({id:uid(),nome:'',desc:'',kcal:'',prot:''});render();
    var m=document.getElementById('mn-'+(dr.refeicoes.length-1));if(m)m.focus();return}
  if(a==='delmeal'){dr.refeicoes.splice(+el.getAttribute('data-i'),1);return render()}
  if(a==='save'){
    var wk=wkey(),cur=planFor(wk),prevEff=clone(cur),nd=clone(cur),wasEx=(cur.ex||[]).indexOf(state.sel)>-1;
    dr.treinos.forEach(function(w){w.exercicios=w.exercicios.filter(function(x){return (x.nome||'').trim()})});
    dr.refeicoes=dr.refeicoes.filter(function(x){return (x.nome||'').trim()||(x.desc||'').trim()});
    nd.dias[state.sel]={treinos:clone(dr.treinos),refeicoes:clone(dr.refeicoes)};
    if(dr.copy)nd.dias.forEach(function(d,n){if(n!==state.sel)d.refeicoes=clone(dr.refeicoes)});
    nd.ex=(cur.ex||[]).filter(function(n){return n!==state.sel});
    if(!nd.ex.length)delete nd.ex;
    state.plan.versoes[wk]=nd;
    if(dr.escopo==='semana'&&!wasEx){var nx=ymd(addDays(state.weekStart,7));if(!state.plan.versoes[nx])state.plan.versoes[nx]=prevEff}
    state.editing=false;persistPlan();
    return render();
  }
  if(a==='blank'){
    Object.keys(state.plan.versoes).forEach(function(k){
      var v=state.plan.versoes[k];
      (v.ex||[]).forEach(function(n){v.dias[n]=blankDia()});
      delete v.ex;
    });
    persistPlan();return render();
  }
});

document.addEventListener('input',function(e){

      var l=ensureSets(lk),j=+sj;
      l.sets[j]=l.sets[j]||{r:'',kg:''};l.sets[j][p]=t.value;
    }else{
      var doc=weekDoc();doc.d[lk]=doc.d[lk]||{};doc.d[lk][p]=t.value;

  if(t.getAttribute('data-bw')){if(!state.loaded[wk])return;weekDoc().bw=t.value;persistWeek(wk);return}
  var cf=t.getAttribute('data-c');

  if(f==='wtitulo')dr.treinos[wi].titulo=t.value;
  else if(f==='wnota')dr.treinos[wi].nota=t.value;
  else if(f==='enome')dr.treinos[wi].exercicios[ei].nome=t.value;
  else if(f==='eseries')dr.treinos[wi].exercicios[ei].series=t.value;
  else if(f==='ereps')dr.treinos[wi].exercicios[ei].reps=t.value;

  else if(f==='mdesc')dr.refeicoes[i2].desc=t.value;
  else if(f==='mkcal')dr.refeicoes[i2].kcal=t.value;
  else if(f==='mprot')dr.refeicoes[i2].prot=t.value;
  else if(f==='copy')dr.copy=t.checked;
  else if(f==='escopo')dr.escopo=t.value;
});

});
